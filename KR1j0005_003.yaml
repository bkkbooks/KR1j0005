body:
  text: 欽定四厙全書爾雅注卷下宋鄭樵撰釋艸第十三蒮山韭茖山蔥葝山䪥蒚山蒜蒮音育茖音格葝音勍䪥即薤字蒚音力山中亦有此種頗與家園種植相類薜山蘄薜音百蘄音芹當歸也葉似蘄而大椵木權櫬木槿即朝生暮落花也今亦謂之木槿一名椵音叚一名櫬音櫬一名王蒸一名舜華术山薊蒼术也音計楊枹薊白术也葥王蔧椶櫚也葉可為帚蔧葥音箭蔧音邃菉王芻藎艸亦名菉蓐音菉拜蔏藋藋徒弔反疑即商陸蘩皤蒿舊云白蒿見本艸蒿菣蔚牡菣青嵩也郭云今人呼青蒿香中炙啖者爲菣去刃反牡菣無子者蔚音尉齧彫蓬薦黍蓬彫蓬米茭也其米謂之彫胡黍蓬野茭也以只可為薦故曰薦􅤴鼠莞龍須艸生山谷以可為席故有莞名􅤴音婢莞音官葝鼠尾鼠尾艸亦可染皁菥蓂大薺菥音惜蓂音覓極似薺菜但葉差大而莖稍高耳一名馬辛一名大蕺一名蔑菥蒤虎杖所在有之只名虎杖莖葉班赤犬柢似馬蓼但無毛耳蒤音涂孟狼尾郭云似茅今人亦以覆屋瓠棲瓣瓣方莧反瓠核也茹藘茅蒐今之蒨艸可染絳果臝之實栝樓今亦曰苽蔞荼苦菜生山谷味苦今人呼苦益萑蓷萑音佳蓷也曰反益母也俚呼盆母艸一名茺蔚虉綬虉音逆郭云小艸有雜色似綬疑即赤孫施艸也粢稷今謂之穄五榖之長故以為粢盛狀如蘆荻結穗亦相似衆秫黏粟也本名粱衆音中戎叔謂之荏菽大豆也卉艸百艸總名萒雀弁萒音兖未詳蘥雀麥蘥音藥即燕麥也苗似小麥而弱實似穬麥而細所在有之蘾烏薞萰菟荄蘩菟蒵蘾戸怪反薞音孫萰音練菟音皆未詳蔩菟苽即土瓜也俗呼新羅葛月令謂之王瓜蔩音演茢薽豕首茢音列薽音真天名精也今謂之火薟荓馬帚地帚也似蒿蓍可為帚荓音瓶䕇懷羊䕇胡罪反未詳茭牛蘄馬蘄也今謂之胡蘄葖蘆萉萉即菔字誤也俗呼蘿匐淔灌淔音敕未詳茵芝苬音囚芝菌屬瑞艸也筍竹萌簜竹簜竹别名儀禮簜在建鼓之間音蕩莪蘿莪蒿也本艸謂之廩蒿似艾而細可食苨菧苨苨音禰菧音底薺苨也絰履未詳莕接余其葉苻今水荇也蔓鋪水上白華野菅小雅云白華菅兮今亦謂之菅似茅而髙大薜白蘄即上山蘄菲芴即土瓜也葍䔰即商陸也葍音福䔰音富熒委萎萎蕤也熒音迥葋艼熒葋音劬艼音朾未詳竹萹蓄即萹竹也衞風云菉竹猗猗萹匹善仄葴寒漿葴音針今酸漿艸亦名苦耽薢茩芵茪薢音皆茩音狗芵音決茪音光决明菜莁荑蔱蘠今亦謂之莁荑然當入木部瓞瓝其紹瓞郭云俗呼瓝瓜為瓞紹者瓜蔓緒亦著子但小如瓝步角反芍􅝀茈今亦謂之鳧茈根作小塊生水田中可食蘱薡蕫似蒲而細可為屩亦可為席蘱薡蕫音類鼎童蕛苵似稗而小蕛音啼苵音迭鉤芺苦芺也今謂之雞頭䪥鴻薈即䪥菜也似韭而大薈音㑹蘇桂荏今只謂之蘇以其香似桂莖葉似荏故曰桂荏蔷虞蓼虞蓼澤蓼也生水中者蓧蓨即苕也蓧蓨音條惕虋赤苗青門赤粱粟也芑白苗白粱粟秬黑黍秠一稃二米秠赤黑黍之有二米者稌稻水田所種曰稻葍藑茅商陸有二種赤者為藑茅臺夫須即雲臺菜舊説以為莎艸藆藅上音蹇下音伐未詳莔貝母今常用之藥莔音萌荍蚍衃蜀葵也荍蚍衃音翹毗浮艾冰臺今艾蒿蕇亭歴葉似芥子似車前子亦常用之藥蕇音典苻鬼目莖葉如苦耽實似耳璫兒童或食之薜庾艸藤生蔓延牆樹間花生頗似薜荔蔜􅭚􅘚蔜􅭚􅘚音遨嫂縷蘩蔞也可為菜茹兼作牙藥離南活茺通艸也瓤白可作婦人首飾萒音奪蘢天蘥蘢音龍未詳須葑蓯菰葑也積舊茭頭而成封筏者葑方孔反蓯音總蒡隱荵牛蒡也亦可瀹食葉如芥蒡滂廣反荵音忍莤蔓于郭云艸生水中一名軒于江東呼莤音猶蓾蔖苴艸也可為屨生鹵地蓾音魯蔖才古反柱夫摇車柱夫音主扶郭云蔓生細葉紫華可食今俗呼曰翹摇車出隧蘧蔬菌類生菰艸中美可食蘄茞蘪蕪即芎藭葉茞昌改反茨蒺蔾蔓生布地子有三角似菱而小蘮蒘竊衣郭云似芹可食子大如麥兩兩相合有毛著人衣故俗云鬼麥蘮挐音計如髦顚蕀音棘大㦸也一名女术雚芄蘭雚音貫即蘿摩菜蔓生斷之有白汁可啖􅙛莐藩蓐音覃知母也蕍蕮音俞昔澤瀉也蔨鹿藿其實莥蔨俱隕反藿音霍莥女九反鹿豆也苗似豌豆蔓生亦可為菜根黄而香薃侯莎其實媞即莎艸或云即香附子亦名莎艸其根生塊似實爾雅誤以為實也如莎艸之類皆無實薃媞音浩提莞苻蘺其上蒚即蒲也西人呼蒲為莞蒲謂其首為臺江東謂之苻蘺其上臺莖别名蒚音翮荷芙蕖其莖茄其葉蕸其本蔤其華菡萏其實蓮其根藕其中的的中薏本謂近根處白莖也實謂蓮房的謂子薏蓮子中苦心茄蕸蔤音加遐密菡戸感反萏徒感反紅蘢古其大者蘬紅艸也似蓼而高大多毛故謂之馬蓼蘬丘軌反蒫薺實薺子也蒫才何反黂枲實黂扶刃反大麻子枲麻枲即大麻也可為布須薞蕪一名葑即蔓菁也菲蒠菜即遂菜也蒠音息蕢赤莧莧有赤白二種蘠蘼虋冬今謂之天門冬其蔓葉可愛蘼音美萹苻止萹音偏亦蒲類濼貫衆音爍即鳯尾艸根莙牛薻莙其隕反薻音藻水藻之類而葉差大生水底蓫薚馬尾即商陸蓫他六反薚他羊反萍蓱浮萍也今謂之薸其大者蘋舊説即萍類而大者按萍屬不可食此必蓴類葉亦圜浮水上如萍也蓱音瓶菟葵見本艸郭云似葵而小葉狀如藜有毛汋啖之滑音希芹楚葵芹菜也藬牛蘈即羊蹄菜藬吐回反蘈音頽藚牛脣狀似麻黄亦謂之續斷其節拔可復續生沙阪藚音續苹藾蕭蔞蒿也連異翹亦名旱蓮狀似當歸而非鱧腸也本艸謂之連翹澤烏蕵即前蘾也𫝊撗目郭云一名結縷俗呼鼓筝艸釐蔓華郭云一名蒙華蔆蕨攗芰也今亦謂之蔆攗音睂大菊蘧麥瞿麥也叢生莖細弱今人多植庭院間其花與葉皆可愛故有南天竹之名薜牡未詳薜音百葥山莓樹生其子可食俗呼桑莓莓亡救亡佩二反齧苦菫即菫葵也葉似桺子如米汋食之滑藫石衣藫音覃水中苔也可食蘜治牆音菊今黄菊也唐蒙女羅女羅菟絲即菟絲也此有四名苗蓨未詳茥蒛盆覆盆子茥蒛音奎缺芨菫艸烏頭也郭云江東呼為董虃百足音纖未詳菺戎葵音肩即蜀葵也蘻狗毒音計薊也俗呼雞項似芥而多刺垂比葉未詳蕧盜庚音復旋復似菊藥家多用苧麻母苴麻也以為布喪服所用俗謂黄麻苧音宁瓝九葉其艸一叢九葉因葉命名藐茈艸今染紫之艸也茈音紫倚商活脱即離南也俗謂通艸脱音奪蘵黃蒢蘵菜也俗呼竹茶可作葅葉似蒟醤葉蘵蒢音職除藒車芞輿芸蒿也藒芞音挈氣權黃華野決明葞春艸音弭芒艸也似菅蔠葵蘩露蔠葵一名承露見本艸菜部蔠音終菋荎藸菋音未荎直其反藸音除五味子也蒤委葉茅針也良耜云以茠荼蓼皇守田即童粱也一穗未得數粒榖而易墮落明年復生故謂之守田鉤藈姑音睽即土瓜也一名王瓜望椉車郭云可以為索長丈餘椉音繩困衱袶衱袶音却絳未詳欔烏階欔音矍稂𥝧艸也亦云烏𥝧子連相著狀如𥝧齒可以染皁杜土鹵杜衡也葉似馬蹄故謂之馬蹄今南人誤作細辛用之盱虺牀蛇牀也甚香藥家多用之蔝蔜音米遨未詳赤枹薊即白术菟奚顆涷款凍也涷音東今謂之款冬其花似枇杷花中馗菌地蕈也馗音逵小者菌此辨蕈大小也大者名中馗小者名菌小葉未詳音輒苕陵苕黄華蔈白華茇苕音調陵苕今謂之凌霄花本艸謂之紫葳蔓生依縁樹木皆黄花少見有白華者蔈茇音標沛蘪從水生艸從水生者曰蘪曰睂薇垂水薇菜生水邊薜山麻野苧也苧而自生於山谷者莽數節竹類也小實如木促節可為杖數音朔桃枝四寸有節今桃枝竹可為杖粼堅中竹類而中實粼音吝簢筡中竹類而中極虗簢筡音閔徒仲無笐篔簹竹笐音杭䈚箭萌箭萌箭竹筍也䈚音怠篠箭今箭竹小而希節枹霍首素華軌鬷皆未詳芏夫王即鹹艸也可為屨生鹵地芏音杜藄月爾今謂綦蕨似蕨而大可食葴馬藍即馬藍菜姚莖涂薺菥蓂也櫂莖高於薺而相似芐地黃芐音戸蒙玉女即女蘿也拔蘢葛似葛蔓赤有節其葉似凌霄花葉多蔓延籬落藗牡茅郭云白茅屬菤耳苓耳菤音捲舊説蒼耳非也此即卷菜葉如錢細蔓被地蕨􅣀今蕨芽也所在山谷有之􅣀音鼈蕎卭鉅即大㦸也蘩由胡未詳莣杜榮即芒艸也似菅茅可為履繩芒音忘稂童粱守田也俗呼鬼稻云米之所産一穗之間得一二榖而已藨麃地莓也多生園囿側子似覆盆亦可食藨逋苗反麃平表反的薂音亦即蓮實購蔏蔞蔞蒿也茢勃茢音列石芸也見本艸葽繞蕀蒬葽蒬音杳寃逺志也茦刺艸針刺人者也方言凡艸木刺人北燕翊鮮之間謂之茦音冊關西謂之刺蕭萩音秋即青蒿也或云牛尾蒿今藥家謂之青葙子􅙛海薻今亦謂之海藻其狀如繅生海島蓋紫菜之類長楚銚弋銚音姚羊桃也藤生子赤狀如鼠糞故亦名鼠矢兒童食之蘦大苦舊謂廿艸近沈存中辨謂為黄藥甚明芣苢馬舄馬舄車前今謂之車前艸綸似綸組似組東海有之綸音關鹿角菜也赤而攣屬似綸帶組海苔也似組綬或云綸即昆布帛似帛布似布華山有之必藤蔓之煩有似布帛故名苀東蠡苀亡剛反薜荔也緜馬羊齒郭云艸細葉葉羅生而毛有似羊齒今江東呼為鴈齒繅者以取繭緒據今人所用為繭緒者多以蕨莽萿麋舌萿古活反郭云今麋舌艸春生葉似舌搴柜朐音蹇巨劬未詳蘩之醜秋爲蒿醜種性也春時各有莖苗之異至秋惟有子皆相似而氣味異此蘩謂皤蒿之蘩也芺薊其實荂芺音夭荂音桴此謂苦芺與苦薊莖頭結實皆有蓊臺其中茸茸然蔈荂荼蔈音標荼茅秀也猋藨芀苕也即菅花可為苕帚猋藨竝必遥反芀音調葭華亦謂蘆花葭音叚蒹薕荻也蘆屬而小可為箔葭蘆此即蒹葭之葭謂蘆爾菼薍似葦而小實中菼他感反其萌虇音勸蘆筍也蕍芛葟華榮曰蕍曰芛曰葟曰華皆艸木𤼵榮也芛羊菙反卷施艸拔心不死卷施艸一名宿莽離騷云朝搴阰之木蘭兮夕擥洲之宿莽荺茭艸根嫩而可食者亦筍屬郭云江東呼藕紹緒如指空中可啖之者曰茭荺于閔反荄根别二名攫橐含未詳華荂也郭云江東呼華為荂音敷華荂榮也轉相釋木謂之華艸謂之榮不榮而實者謂之秀榮而不實者謂之英釋木第十四槄山榎山楸也其材有文緻中車版樂器盤合用槄音叨栲山樗山樗似樗而葉差狹樗木葉似椿江東呼為虎目葉脱處有痕如樗蒱子又如眼目柏椈柏服餌家所重髠梱未詳梱苦門反椵柂白椵也樹似白楊其材耐溼椵柂音叚陁梅柟今梅子也柟而占反柀煔音彼杉杉木也櫠椵音廢賈大柚也大如皮瓤極厚杻檍音狃億俗呼牛筋木其材堅靭中車輞及弓弩楙木瓜今多出宣州椋卽來椋音良椋子也其材亦堅靭栵栭音例而茅栗也郭云江東呼栭栗檴落檴音鑊郭云可以為杯器據此則今檉杉也柚條今謂之柚似橘而大皮瓤厚時英梅雀梅也梅類而實小楥柜枊音爰巨卬烏臼也葉可染皁子可作油燭栩杼柞木今人以為梳味荎著釋艸已有此誤重出藲荎刺榆也有針刺如柘其葉如榆汋為䔫美滑於白榆藲音歐荎大結反杜甘棠北人謂之杜梨南謂之棠梨狄臧槔貢綦皆未詳朹檕梅郭云朹樹狀如梅子如指頭赤色似小㮏可食朹檕音仇計朻者聊未詳朻音糾魄榽橀郭云魄大木細葉似檀今江東多有之齊人諺曰上山斫檀榽橀先殫按此俗呼朴樹其木如檀子大如梧桐子而黄榽橀音系醯梫木桂桂之厚皮者今人呼為木桂大柢即肉桂也梫音寢棆無疵今謂之釣漳椐樻音祛喟郭云腫節可為杖按此木似藤節目相對今人以為杖甚竒檉河桺殷檉也生水畔其葉經冬變紅旄澤桺杞桺也生澤中如蘆荻可編為捲箱楊蒲桺水楊也可為箭簳葉圜闊樹與桺相似故名楊桺采薇所謂楊桺依依左氏所謂董澤之蒲即此也權黃英輔小木皆未詳杜赤棠白者棠此别棠棃赤白之異名諸慮山櫐山藤也詩稱葛藟本艸千嵗櫐櫐皆謂藤欇虎櫐虎豆也藤蔓林樹生莢有毛刺欇音渉杞枸檵枸杞也檵音計杭魚毒今南人謂之杭樹其皮可煎汁藏梅也檓大椒秦椒也與蜀椒相似稍大而香氣減焉俗呼樛子楰鼠梓苦楸也楓欇欇音輒今只謂之楓木寓木宛童樹上寄生木也有二種一種葉圜名蔦一種似麻黃名女蘿無姑其實夷無夷也櫟其實梂亦謂之橡一名皁斗其實作梂音求似栗毬而小檖蘿山棃也楔荆桃音戛今櫻桃也旄冬桃今謂之旄桃冬熟藤生山谷榹桃山桃榹音斯今野出之桃味稍酸不解核休無實李一名趙李痤椄慮李今之麥李即青李也駁赤李粉李也赤而著粉此别李之屬異也棗壺棗郭云棗大而鋭上者為壺邊要棗郭云子細腰今謂之鹿盧棗櫅白棗音齊郭云即今棗子白熟樲酸棗今亦謂之酸棗孟子所謂養其樲棘楊徹齊棗未詳遵羊棗郭云實小而園紫黒色俗呼為羊矢棗孟子曰曾晳嗜羊棗洗大棗洗先典反郭云今河東猗氏縣出大棗子如雞卵煑塡棗未詳蹶泄苦棗子味苦晳無實棗不著子者還味捻棗郭云還味短味櫬梧梧桐也以其可為棺襯故曰櫬樸枹者即柞木也謂櫬采薪采薪即薪櫬也采薪也即薪也皆樵薪之異名爾棪㯈其音琰速郭云棪實似奈赤可食劉劉杙即石榴本艸謂之安石榴櫰槐大葉而黒槐有二種大葉而黑者曰欀守宮槐葉晝聶宵炕聶音輒炕音亢槐葉晝聶合而夜炕布者名守宫槐槐小葉曰榎郭云槐當為楸楸細葉者為榎大而皵楸郭云老乃皮麄皵者為楸皵音舄又音錯小而皵榎此别楸榎之異左傳曰使擇美檟椅梓梓今亦謂之梓木良材也桋赤梀白者梀俗呼斥木叢生可作籓籬大者任車輞梀山厄反終牛棘郭云即馬棘也其刺麄而長灌木叢木周南云集于灌木瘣木苻婁謂木病尪傴癭腫無枝條詩云譬彼瘣木疾用無枝瘣胡罪反蕡藹藹猶茂也枹遒木魁瘣魁瘣謂木叢攅迫而生者棫白桵即山柘也桵音蕤棃山樆野出之棃小而酢桑㸤有葚梔辨音片半也桑樹一半有葚一半無葚曰梔女桑桋桑郭云今俗呼桑樹小而條長者為女桑樹榆白枌音份今謂之榆其皮可屑食療飢唐棣栘音移移楊也亦名扶栘似白楊常棣棣郁李也檟苦荼茶也本艸謂之茗苦􅖗樕樸心俗呼樸樕其樹易大花葉似栗榮桐木即梧桐棧木干木郭云僵木也江東呼大觡檿桑山桑似桑而材尤靭可作弓及車轅檿烏黠反木自弊柛立死椔蔽者翳柛音申椔側吏反弊仆也皇矣云其椔其翳木相磨槸棤皵梢梢櫂槸樹或枝相磨剴者皵甲麄錯者梢擢無枝柯長而殺者槸措皵梢擢音勢錯舄朔濯樅松葉柏身樅七容反郭云今大廟梁材用此木尸子所謂松柏之鼠不知堂密之有美樅按此良材也今謂之松蘿檜柏葉松身檜似柏而茂人多植庭院句如羽喬郭云樹枝曲巷如鳥毛羽下句曰朻上句曰喬如木楸曰喬郭云楸樹性上竦如竹箭曰苞箭竹叢生或言如竹箭之條直如松柏曰茂如槐曰茂松柏與槐極沃茂故取象焉祝州木髦柔英皆未詳槐棘醜喬槐棘之種性枝皆喬竦桑柳醜條抽長條也椒榝醜莍榝欓子茱萸亦謂之椴此類結子成毬朶桃李醜核謂子中有核人瓜曰華之桃曰膽之棗李曰疐之樝棃曰鑚之華胡化反半破也膽去毛也疐去柢也鑽去心也樝似棃而酢澀小枝上繚爲喬無枝爲檄繚音了謂小枝上擢繞大枝也檄音亦木叢生爲灌釋蟲第十五螜天螻螜音斛夏小正三月螜則鳴即螻蛄也似蟋蟀多在園中為宂藏害殺毛蜚蠦蜰郭云蜰即負盤臭蟲按此亦謂之負蠜即艸蟲也春秋書蜚以其能害稼也蜚扶味反蠦蜰音盧肥螾􅨪入耳音引演蚰蜒也關東謂之螾􅨪以其狀亦有類蚯螾也能入人耳故亦名入耳蜩蜋蜩螗蜩蚻蜻蜻蠽茅蜩蝒馬蜩蜺寒蜩蜓蚞螇螰蜩即蟬之異名此辨蟬之類也蜋蜩夏小正曰五彩具此即四五月間小蟬有文彩先諸蟬而鳴者螗即螗蜋也亦能在艸叢中鳴蜻蜻郭云如蟬而小引方言有文者謂之螓及夏小正鳴蚻虎懸以為證按此即一種蟬似蜻蜓其鳴無韻但札札然蚻音札蠽音節茅蜩似蟬而小有青紅二種只在茅管中亦是五月時鳴蝒音緜馬蜩蟬類中最大者其聲響震巖谷寒蜩即寒螿也一名蟪蛄月令七月寒蟬鳴即此也蜓蚞音挺木螇螰郭云即蝭蟧也一名蟪蛄齊人呼為螇螰蛣蜣蜣蜋今人亦謂蜣蜋能取糞為圜莊子曰蛣蜣之智在於轉丸蛣音詰蝎蛣􅔒蝎自是一種而此即木中蠹蟲也亦名蝎音歇又音曷蠰齧桑有長角斑黒色帶甲亦能飛俗呼山羊喜齧桑樹或云即桑中蠹蟲化而為此也蠰音餉諸慮奚相未詳蜉蝣渠畧似蜣蜋而小者文彩多青黄色者蛂蟥蛢音拔黄瓶即蜉蝣也容有小異郭云江東呼黄蛢蛢音瓶今謂之蜉蛢權輿父守瓜今瓜葉上黄甲小蟲能飛喜食瓜葉匏上亦有之蝚蛖螻即螻蛄也方言云南楚謂之杜狗今閩人亦為杜狗蝚蛖音柔尨不蜩王蚥未詳蛄䗐強䖹郭云今米榖中蠧小黑蟲是也建平人呼為子䖹音美不過蟷蠰其子蜱蛸蟷蠰即螗蜋也蠰音箱蜱蛸音毗消螗蜋繭蒺蔾蝍蛆蜈蚣也蝝蝮蜪音縁覆陶郭云蝗子未有翅者蟋蟀蛬今人亦謂之蟋蟀一名青􅖹楚人謂之王孫幽州人謂之促織蛬音拱又音笻蟼蟇即蝦蟆蟼音驚蛝馬䗃郭云馬蠲虳俗呼馬方言云馬蚿北燕謂之蛆其大者謂之馬蚰蚰即也蛝䗃音銀棧阜螽蠜艸螽負蠜蜤螽蜙蝑蟿螽螇蚸土螽蠰谿此辨螽之類也阜螽蝗也艸螽艸蟲也亦謂之蚱蜢蜙蝑音蒿胥一名蜙䗥即一種大青蚱蜢股長而鳴甚響螇蚸郭云似蜙䗥而細長飛翅作聲者蠰谿似蝗而小斑色多生園中郭云今謂之土以其在土中也蠜蜤蟿蚸蠰音煩斯契歴攘螼蚓蜸蚕亦謂之䖤蟺江東呼寒蚓即蚯蚓也螼𦍑引反蜸苦顯反莫貈螳蜋蛑螳蜋有蛑斧故曰螳蜋蛑貈音鶴虰蛵負勞音丁馨即蜻蜓也亦謂之青蛉蜭毛蠧蜭戸感反即蛓也亦謂之螫蟲其毛能毒人似蜂蠆蟔蛅蟴音黒髯斯黑毛蟲也亦謂之蛓以其毛能黏著人故謂之炶蟴蟠䑕負蟠音煩瓮底下白粉蟲也蟫白魚音淫衣魚也亦謂之蠹魚以能蠹衣裳書帙一名炳魚一名蟫䖸羅蠶䖸也螒天雞音汗莎雞也一名酸雞一名樗雞黑身赤頭似斑猫傳負版未詳强蚚音祈牛䖟也蠅類噉牛馬血蛶􅲈何未詳螝蛹蠶蛹也螝音圭蜆縊女音寅説文云蜕為蝶也郭氏謂小黒蟲赤頭喜經死故曰縊女蚍蜉大螘小者螘蠪朾螘螱飛螘其子蚳此辨蟻之類也蟻亦作螘大螘即馬蟻也大而黑郭云俗呼馬蚍蜉小螘謂小黄蟻也以其種多故呼其名朾螘是一種大蟻赤色斑駁者飛螘凡蟻老則皆生翅能飛遂化為他類矣蚳蟻卵也似飲粒亦可為醤周禮醢人蜃蚳醢蠪朾螱蚳音聾丁尉池次蟗䵹鼄䵹鼄鼄蝥土䵹鼄艸䵹鼄此辨䵹鼄之類也方言云關西秦晉之間謂之鼄蝥關東趙魏之郊謂之䵹鼄在土中布網者曰土䵹鼄在艸中布網者曰艸䵹鼄土中者能毒人俗謂天虵蠹蝥音秋謀土蠭木蠭在土中作窠者曰土蠭在木上作房者曰木蠭蟦蠐螬糞土中大白蟲也蟦音蕡蝤蠐蝎木中蠧蟲也方言云關東謂之蝤蠐梁益之間謂之蝎􅢤威委黍即䑕負也􅢤音伊蠨蛸長踦小䵹鼄長脚者俗呼喜子踦巨綺反蛭蝚至掌未詳國貉蟲蠁郭云今呼蛹蟲為蠁廣雅云土蛹蠁蟲蠖蚇蠖郭云今蝍􅠸説文云蠖屈伸蟲也果臝蒲盧螟蛉桑蟲蒲盧俗謂之蠮螉蓋蠭類螟蛉桑上青蟲也蠮螉取以為子者蝎桑蠧即蛣􅔒螢火即炤螢也腹下有光夜飛密肌繼英釋鳥有此誤重出耳蚅烏蠋郭云大蟲如指似蠶見韓子蠓蠛蠓似蚋而小斜陽則羣聚鬭飛蠓莫孔反王蛈蝪䵹鼄類也一名螲蟷穴居布網宂口有蓋河北人呼蛭蝪音絰湯蟓桑繭雔由樗繭棘繭欒繭蚢蕭繭此皆蠶類吐絲成繭者食桑葉為繭者曰蟓音象蓋蠶也或云野蠶食樗葉棘葉欒葉為繭者曰雔音讎食蕭葉為繭者曰蚢音杭蕭蒿也翥醜罅螽醜奮强醜捋蠭醜螸蠅醜扇醜僻也猶人性之有僻然翥即蛀字借用耳此即蛀蟲之有角甲者蓋齧桑類也罅張拆也此蟲之僻在於張角拆甲艸蟲之僻在於振股作聲強蚚之僻在於以脚自摩捋螸音俞説文云垂腴也腴即腹下也蠭之僻在於卷蠆向腹蠅之僻在於摇翅自扇以此使學者當究知物之情態也食苗心螟食葉食節賊食根蟊四者竝見大田詩螟極纎細在苗之心若木中有蠹然今農家忌大小署日降一種霏微者云即此蟲降也詩作螣一種蟲似螟蛉食苗葉而卷為房賊即艸蟲類雖亦食葉好食節蟊未詳陸璣謂螻蛄據螻蛄雖宂土以居然亦取葉於宂中而食之元不食根惟陸田冇之有足謂之蟲無足謂之豸丈尔反釋魚第十六鯉今只謂之鯉鱣章連反黄鱏魚也短鼻口在頷下體有邪行甲無鱗大者長二三丈重千餘斤亦能化為龍鰋今白魚也偃鼻向額故名鮎音黏今只謂之鮎郭云江柬通呼為鮧鱧今只謂之鱧多在泥水中服食家忌食鯇華板反今鱏魚也其性徤急鯉鱣鰋鱧鮎鯇六者之名顯而易識故但載之而已不復重釋也舍人以鯉為鱧孫炎以鰋為鮎誤矣鯊鮀音沙陀小魚體圜而有㸃文常張口吹沙故亦名吹沙鮂黑鰦郭云謂即白鯈江東呼為鮂音囚樵又疑即鮆魚背黑故亦名黑鰦音兹鰼鰌音習秋今泥鰌似鱔而小鰹大鮦小者鮵即鱧也郭云今青州呼小鱺為鮵按鱺與鱧音義同鰹鮵音堅奪魾大鱯小者鮡郭云鱯似鮎而大白色魾鱯鮡音皮畫兆鰝大鰕郭云鰕大者出海中長二三丈鬚長數尺今青州呼鰕魚為鰝音鄷鄗按海中大鰕如臂者有之少見有許大者鰕今俗呼何蓋鰝之訛耳鯤魚子鯤凡魚子之總名亦謂之鰥鱀是鱁郭云鱀䱜属也體似鱏尾如䱡魚大腹喙小銳而長齒羅生上下相銜魚鼻在額上能作聲少肉多膏胎生健啖細魚大者長丈餘江中多有之樵又疑即鱁鮧也鱀音忌鱦小魚郭云家語曰其小者鱦魚也今江東亦呼魚子未成者為鱦音繩鮥鮛鮪鮪似鱣而小亦似鮎大者曰王鮪小者曰鮛鮪郭云建平人呼鮥子即此魚也音洛鮛音叔鯦當魱鯦音咎海中黄魚也似鯿而大肥美多鯁江東呼其最大者為當魱音胡鮤鱴刀音列蔑郭云今之鮆魚也亦呼為魛魚按鮆魚所在有之鱊鮬鱖鯞音聿歩厥帚郭云小魚也似鮒子而黒俗呼為魚婢江東呼為妾魚廣雅云鮒鰿也此似鰿之小者魚有力者鰴謂凡魚之健者總名鰴音徽魵鰕魵音墳據此所言即鰕也然説文字林皆謂魵魚名出穢邪頭國郭氏引以為證樵謂魵魚自有之而此所謂魵者乃鰕也不得引彼證此鮅鱒似鯶而小眼赤多生溪澗傳麗水底難網捕鮅音必鱒才損反魴魾鯿魚也魾音毗鯬鯠音犂來今鰻魚也亦呼鰻鯬蜎蠉井中小蛣蟩赤蟲也一名子孑見廣雅蜎狂兗反科斗活東蝦蟆子未生脚者魁陸魁蛤也見本艸詳矣而郭氏謂為蚶按蚶即瓦隴也亦名蝛䗯輿此自殊蜪蚅未詳鼁􅖚蟾諸在水者黽鼁音去蟾諸似蝦蟇居陸地方家所謂蟾蜍即此也黽似蝦蟇而大在池澤中亦名水雞亦名土鴨南人啖之􅖚諸音秋徐蜌螷音陛皮説文云脩為蠯圜為􅛔郭氏云今江東呼蚌長而狹者為蠯按今池澤中生蚌蛤有此圜長二種蚌含漿郭云即蜃也按此今謂之珠母老能産珠其甲曰方諸照月生水故曰含漿鼈三足能龜三足賁今所在山谷池澤或有此二物能奴來反蚹蠃螔蝓音附螺移俞即蝸牛也蓋蠃屬帶殻而行蠃小者蜬音含郭云螺大者如斗出日南漲海中可以為酒杯按今所謂鸚鵡杯者是出海南螖蠌小者蟧埤蒼云螺屬郭氏謂或云即彭螖也似蟹而小然據上下文合是螺屬也螖蠌蟧音滑澤勞蜃小者珧即小蚌也一名玉珧可飾佩刀削者傳云天子玉琫而珧珌是也山海經激女水中多蜃珧音遥龜俯者靈仰者謝前弇諸果後弇諸獵左倪不類右倪不若此辨龜之形體有異其名亦不同也俯頭低則其甲前覆下仰頭昻則其甲前偃而向上前弇謂其甲前橢長也後弇謂其甲後橢長也倪睨也五計反左睨者左顧之龜其甲亦偏向左右睨者右顧之龜其甲亦偏向右此以釋周禮龜人六龜也諸辭也不發聲也貝居陸贆在水者蜬大者魧小者鰿𤣥貝貽貝餘貾黄白文餘泉白黄文蚆博而頯蜠大而險􅜽小而橢此辨貝水陸大小文彩不同其名亦異也貝今曰瑇瑁蓋龜屬故説文云貝海介蟲也其甲人之所寳古今以為貨泉交易今盡出南蕃海中凡貝皆帶黄白色而有黑紫點𤣥貝者多黒文餘貾者黄色而㣲白餘泉者白色而㣲黄然皆有紫黑點舊説謂黄質而白文白質而黄文誤矣貝無此也頯者中央廣兩頭鋭蜠者大而汚薄橢者小而狹長贆魧鰿貾蚆頯􅜽音摽抗積池巴逵責蜠求隕反橢他果反蠑螈蜥蜴蜥蜴蝘蜓蝘蜓守宮也今按小而青者曰蜥蜴大而黄者曰蝘蜓最小在牆間砌下者曰守宫種類既異而此釋為一物恐亦未審也蠑螈音榮原䭿蝁䭿音迭郭云蝮屬大眼最有毒今淮南人呼蝁子音惡螣螣蛇郭云龍類也能興雲霧而遊其中淮南云蟒蛇螣螣音朕騰蟒王蛇蟒蛇之大者曰王蛇音莽蝮虺博三寸首大如擘江淮以南曰蝮江淮以北曰虺此蛇傷人最慘毒博廣也言其身之廣擘拇指也樵疑擘為臂之訛爾豈有身廣三寸而頭如拇指者擘音百鯢大者謂之鰕鯢雌鯨也大者長八九尺狀似鮎魚四脚前似獼猴後似狗聲如小兒啼今㓊庭多有之魚枕謂之丁魚腸謂之乙魚尾謂之丙以本有此名故作文字者象其形而為之此則為實文也如十日之字乃因音借此耳許氏妄以乙丙丁之字而取十日之義焉禮記内則魚去乙者謂魚日旁骨似乙文故亦為乙然則乙似魚腸亦似目旁骨故兩得焉一曰神龜二曰靈龜三曰攝龜四曰寳龜五曰文龜六曰筮龜七曰山龜八曰澤龜九曰水龜十曰火龜神龜龜之最靈者靈龜其甲有文似瑇瑁而差薄耳一名觜􅏲一名靈蠵俗呼靈龜能鳴多出涪陵其甲可以辨攝音輒攝龜小龜也好食蛇故亦謂之蛇龜郭云腹甲曲折解能自張閉江東呼為陵龜或言此龜乃蛇所化故頭尾似蛇俗呼鴦龜寳龜傳國者所寳文龜甲有文彩者河圖曰靈龜負書丹甲青文筮龜常在蓍樷下者龜䇿傳曰蓍滿百莖其下必有神龜守之山澤水火之龜皆其所生之處也火龜蓋生於火者亦猶大山國所出火䑕是也郭氏謂物有含異氣者不可以常理推然亦無所怪釋鳥第十七佳其鳺鴀亦曰祝鳩今所謂鵓鳩也謹愿之鳥其指之之辭鳥之短尾者皆謂之佳惟夫不專名焉故指佳為夫不也鳺方扶反鴀方浮反鶌鳩鶻鵃鶌居物反鶻鵃音骨嘲今謂之鸜鵒似山鵲而小尾短青黑色多聲江東亦呼為鶻鵃廣雅謂為班鳩誤矣斑鳩即鵓鳩也鳲鳩鴶鵴即布榖也一名桑鳩一名擊榖江東呼為穫豰禮記謂之鳴鳩鴶苦八反鵴音菊鷑鳩鵧鷑郭云小黑鳥鳴自呼江東名為烏鵙按此似鸜鵒無冠而長尾多在山寺厨檻間今謂之烏鶂鷑音及鵧符悲反鴡鳩王鴡鳧類多在水邊舊説鵰類誤矣鴡七徐反鵅鵋䳢音格忌欺郭云今江東呼鵂鶹為鵋䳢亦謂之鴝鵅鶅鵵軌音緇兔未詳鴗天狗魚狗也似翡翠而小青碧可愛鴗音立鷚天鸙郭云大如鷃雀色似鶉好高飛作聲今江東名之曰天鷚音綢繆按此雀類似鶉而小尾長所在寒月多有之鸙音藥鵱鷜鵝今之野鵝鵱音六鷜力于反鶬麋鴰即鶬鴰也鵅鳥鵅音洛郭云水烏也似鶂而短頸腹翅紫白背上緑色江東呼烏音駮舒鴈鵝今之鵝也舒鳧鶩鴨也鳽鵁鶄音額交精水鳥也今亦謂之鵁鶄似鳧脚高毛冠郭云江東人家飬之以厭火災也輿鵛鷋未詳鷋音徒鵜鴮鸅音啼鳥澤鵜鶘也形極大喙長尺餘頷下有胡大如數升好羣飛沈水食魚俗謂之淘河鶾天雞鶾音汗逸周書曰蜀人以文鶾文鶾者若翬雉按今有吐錦雞蓋雉類惟蜀中有之甚有文彩鸒山鵲今喜鵲也郭氏謂似鵲而有文彩長尾觜脚赤鸒音握鷣負雀鷣音淫郭云鷣鷂也江南呼之為鷣善捉雀因名云音淫按此即今之小鷂也蓋鶻類南方無鷹唯呼此為鷹齧齒艾艾即鴱也見下文鶨䳢鶨音彖郭云鴒鶨也俗呼癡鳥字林云句喙鳥按此葢鴟類能捐雀句喙目圜黄可畏如拳大老􅟾鴳鴳音晏雀也舊注諸家皆斷老上屬曰鶨䳢老惟樊光斷鶨䳢為句以老下屬據春秋九扈有桑扈老扈明矣桑􅟾竊脂郭云俗謂之青雀按此鳥今謂之蠟觜性甚慧可教色㣲緑其觜似蠟竊古淺字言淺有脂色此所謂其觜之色也鳭鷯剖葦郭云好剖葦皮食其中蟲因名云江東呼蘆虎似雀青斑長尾鷯音遼桃蟲鷦其雌鴱鴱音艾似黄雀而小一名鷦鷯一名鷦􅛯一名桃雀俗呼巧婦鶠鳯其雌皇神鳥也雞頭蛇頸魚尾龍文龜背燕頷麟前鹿後五色備舉高六尺許京房云高丈云出於束方君子之國飛則羣鳥從以萬數故鳯古作朋字䳭鴒渠雀屬也長尾背上青灰色腹白頸下黒飛則鳴行則摇鷽斯鵯鶋亦謂之雅烏葢雀類差小多羣飛食榖粟俗呼必鳥鵯音匹聲相近燕白脰烏即今白頸燕也鴽鴾母鸙也青州呼鴾母曰䑕所化也鴽鴾音如謀密肌繫英英雞也啄啖石英故謂名焉巂周子規也多出蜀巂郡故名焉蜀王望帝化為子規巂希規反燕燕鳦此釋詩燕燕于飛文故重言之燕有二種前言白脰燕知此為紫燕也鴟鴞鸋鴂陸璣諸儒皆謂為巧婦今按景純説此及方言皆謂是鴟類據下言茅鴟怪鴟則此應是鴟屬無張得是巧婦鴞鸋鴂音遥寧決狂茅鴟郭云今􅣽鴟也似鷹而白怪鴟廣雅謂之鴟鵂郭云今江東通呼此屬為怪鳥梟鴟訓狐也日瞑而夜作賈誼所賦鵩鳥是也其肉甚美可為羹臛又可為炙漢供御物説文云梟食母不孝之鳥故冬至捕梟磔之字從鳥首在木上或説即今伯勞也食母鶛劉疾未詳鶛音皆生哺鷇生噣雛鳥子生須母哺而食之者曰鷇古候反謂燕雀之類也生而能自噣食者曰雛謂雞雉之類也噣音啄爰居雜縣海鳥也嘗止於魯東門之外見國語又漢元帝時琅琊有大鳥如馬駒時人謂之𤣥居縣音𤣥春􅟾鳻鶞夏􅟾竊𤣥秋􅟾竊藍冬􅟾竊黃桑􅟾竊脂棘􅟾竊丹行􅟾唶唶宵􅟾嘖嘖竊古淺字言其色之淺唶唶音即嘖嘖音責皆其聲然也或取其毛彩或取其鳴聲以命名􅟾雀屬也皆以時見亦猶鸎鴈然農家須其名以候時故又命以四時也桑棘之􅟾多在是木故名行􅟾者多在籬落如雞雉然不飛去故名宵􅟾者能傳夜故名鳻音汾鶞敕倫反鵖鴒戴鵀鵖彼及反鴔皮及反鵀女金反郭云鵀即頭上勝今亦呼為戴勝鵖鴔猶鶝語聲轉耳按方言關東曰戴鵀鶭澤虞鶭孚往反郭云今婟澤鳥似水鴞蒼黑色常在澤中見人輒鳴喚不去有象主守之官因名云俗呼䕶田雞按此鳥亦多在田中閩人呼為姑雞又謂其名鳴姑雞紡以其聲類紡聲且聒聒不輟鷀鷧鸕鷀也鷧於計反鷯鶉其雄鶛牝庳䳺類此别其雌雄之異名耳鶉蝦蟇所化庳音脾鸍沈鳧似鶩而小尾白俗呼水䲹好没故曰沈鳧鸍音施鴢頭鵁鴢於鳥反郭云似鳧脚近尾畧不能行江東謂之魚鵁詐交反按此鳥類野鴨而有文彩不能行多溷野鴨羣中浮游鵽鳩宼雉郭云鵽大如鴿似雌雉䑕脚無後指歧尾為鳥憨急羣飛出北方沙漠地萑老鵵郭云木也似鴟鵂而小頭有角毛脚夜飛好食雞樵疑此即訓狐以其首似狐故有此等名萑鵵音丸鶟鶘鳥鶟音突郭云似雉青身白頭狂㝱鳥山海經云栗廣之野有五彩之鳥有冠名曰狂鳥皇黃鳥黄鸎也一名倉庚一名商庚一名黄一名楚雀一名摶黍一名黄離畱陸璣云常以椹熟時來故里語曰黄栗畱看我麥粟黄椹不故又名黄栗畱翠鷸音聿翡翠也其羽可以飾器物鸀山烏郭云似烏而小赤觜宂乳出西方蝙蝠服翼今亦謂之蝙蝠䑕所化故又名仙䑕晨風鸇似鷂而小青黄色燕頷鸉白鷢鸉鷢音楊厥郭云似鷹尾上白寇雉泆泆即鵽鳩也鷆蟁母郭云似鳥而大黄白雜交鳴似鴿聲今江東呼為蚊母俗説此鳥常吐蚊因以名云鷆蟁音田文鷉須鸁鷿鷉也似鳧而小其膏可瑩刀劒也鷉鸁音梯螺鼯鼠夷似蝙蝠而大肉翅尾長三尺許背上蒼艾色脚短爪長飛且乳故又名飛生聲如人呼食火烟能從高赴下不能從下上高鼯音吾倉庚商庚即鸎也鴩餔敊音絰歩䜴未詳鷹鶆鳩鶆當鷞字之訛也鷞鳩見左氏鶼鶼比翼説在釋地篇鵹黃楚雀鸎也鵹音黎鴷斵木鴷音列今亦謂之斵木鳥常斵樹剝剝然取蟲食鸄鶶鷵音激唐徒郭云似烏蒼白色鸕諸雉或云即雉也鷺舂鉏白鷺也亦曰鷺鷥陸璣曰汶陽謂之白鷺齊魯謂之舂鉏遼東樂浪呉楊皆謂之白鷺鷂雉鷮雉鳪雉鷩雉秩秩海雉鸐山雉雗雉鵫雉雉絶有力奮伊洛而南素質五采皆備成章曰翬江淮而南青質五采皆備成章曰鷂南方曰􅔧東方曰鶅北方曰鵗西方曰鷷鷂音遥鷂雉即鷮雉也青質而有五采者鷮音驕鳪音卜鳪雉即驚雉也朱冠臉緑項背有文腹下黄赤大如雞雄者有文彩據此文勢是如此郭氏離此為四物誤矣郭云如雉而黒在海中山丄鸐音狄即山雉也此與鷩雉是一種而小異亦有文彩郭云長尾者雗音汗即鵫雉也今謂之白鷴似鴿而大白紅臉可愛鳥之健勇者惟雉雉之有力者曰奮翬鷂皆所産之異􅔧鶅鵗鷷皆所呼之異􅔧音儔鷷音遵鳥鼠同穴其鳥爲鵌其䑕爲鼵郭云鼵如人家䑕而短尾鵌似鵽而小黄黑色突入地三四尺䑕在内鳥在外今在隴西首陽縣鳥䑕同穴山中按首陽今在熙州渭源鵌鼵音徒突鸛鷒鶝鶔如鵲短尾射之銜矢射人鸛鷒鶝鶔音歡團福柔此鳥一名􅦀羿言雖羿亦懈怠不敢射之鵲鵙醜其飛也翪醜僻也翪者竦翅上下鵙音鴃伯勞也翪音宗鳶烏醜其飛也翔鳶鴟也翔謂布翅翺翔鷎翔猶盤旋也鷹隼醜其飛也翬翬猶揮也謂鼔翅揮疾鳧鴈醜其足蹼其踵企蹼音卜謂脚指間有幕蹼屬相著也以其足蹼故飛則伸其脚跟企直也烏鵲醜其掌縮飛則縮脚於腹下亢鳥嚨其粻嗉亢音杭鳥喉嚨也其受粻處名嗉音素粻食也江東呼粻鶉子鳼鴽子鸋别䳺鶉子之名鳼音文雉之暮子爲鷚鷚力救反是雉晚生之子名也鳥之雌雄不可别者以翼右掩左雄左掩右雌鳥少美長醜爲鶹鷅鶹鷅猶流離也自關而西謂梟為流離少為子而美長食母而醜張奐云鶹鷅食母音畱栗二足而羽謂之禽四足而毛謂之獸禽棲木故其羽似葉木獸宿艸故其毛似艸莽鵙伯勞也一名伯趙今亦謂之伯勞郭云似鶷􅗾而大釋獸第十八麋牡麔牝麎其子䴠其跡躔絶有力狄鹿牡麚牝麀其子麛其迹速絶有力麕牡麌牝麜其子麆其跡解絶有力豜麔麎䴠麚麛麕麜麆豜音咎辰杳加述堅君麕麞也麕其總名也栗鋤堅狼牡貛牝狼其子獥絶有力迅子嬎其迹迒絶有力欣豕子豬䝐豶幺幼奏者豱䝐豶者䝐一名豶郭云俗呼小豶豬為䝐子豶謂健豬也幺幼者郭云俗呼豕最後生者為幺幼豚奏者豱謂皮理湊蹙者名豱獥嬎迒䝐豶幺奏豱音亦販剛偉墳腰湊溫豕生三豵二師一特所寢橧四豴皆白􅘻其跡刻絶有力􅙊牝豝橧音增豕所臥之簀也豴音滴蹢也蹢蹄也􅙊音厄郭云豕高五尺者􅘻音垓虎竊毛謂之虦貓竊古淺字虦音殘貘白豹音陌似熊小頭庳脚黑白駁能䑛食銅鐵及竹木牙齒極堅今人多以其牙託為佛牙甝白虎虪黒虎貀無前足晉太康七年召陵扶夷縣檻得一獸似狗豹文有角兩脚即此類也或説豹似虎而黑無前兩足甝音含虪式六反貀足滑反鼳䑕身長須而賊秦人謂之小驢郭云鼳似鼠而馬蹄一嵗千斤為物殘賊鼳古沒反熊虎醜其子狗絶有力麙醜類也郭氏引古律文捕虎一購錢三千其狗半之以為證麙音咸貍子􅡐貈子貆􅡐音曵貈下各反貈似狐善睡亦謂之貉郭云今江東呼貉為􅧯􅤘貆音丸貒子貗貒貗音湍寠貒似豕而肥一名貛貔白狐其子豰貔豰音毗榖豹屬一名執夷遼東謂之白羆麝父麕足其脚似麞而臍甚香父音甫豺狗足今亦謂之豺狗害人牛馬貙䝢似貍貙䝢音樞萬字林云貙似貍而大一名䝢郭氏謂今山民呼貙虎之大者為貙豻羆如熊黄白文羆似熊長頭高脚憨過於熊其脂似熊白而麄麢大羊音靈陶隱居云其角多節蹙蹙圜繞者為麢羊角長惟一邊有節節亦疎大者為山羊按此二羊俱似羊而大在山崖間麠大麃牛尾一角麃音炮即麞也漢武帝郊雍得一角獸若麃然謂之麟即此也麠音京􅕱大麕旄毛狗足今亦謂之􅕱音几旄毛㺜長毛也旄音帽魋如小熊竊毛而黄郭云今建平山中有此獸狀如熊而小毛麆淺赤黄色俗呼為赤熊即魋也音頽䝟貐類貙虎𤓰食人迅走山海經云少咸山有獸狀如牛而赤身人靣馬足名曰窫窳其音如嬰兒食人所説與此異䝟鳥八反羭羊主反狻麑如虦貓食虎豹即獅子也漢順帝時疎勒國獻獅子似虎正黄有頿耏尾端茸毛大如斗驨如馬一角不角者騏驨音攜郭云元康八年九眞郡獵得一獸大如馬一角角如鹿茸此即驨也今深山中人時或見之亦有無角者羱如羊音元郭云似吳羊而大角角䝐出西方麐麕身牛尾一角瑞應獸也黄色圜蹄馬足角端有肉麐即麟字猶如麂善登木説文猶貜屬也麂音几貄脩毫毫毛中之長者貄音四貙似貍即貙䝢也兕似牛兕如野牛青色重千斤一角長三尺餘形如馬鞭柄其皮堅厚可制鎧犀似豕今出交趾形似水牛豬頭三角一在頂上一在額上一在鼻上鼻上者即食角也小而不橢好食棘亦有一角者彚毛刺今謂之刺蝟狀如鼠毛似針狒狒如人被髮迅走食人狒扶味反梟羊也俗呼山都人靣長臂脣見人則笑笑則脣蔽其靣左手操管貍䝖貒貈醜其足蹯其跡􅚵蹯音煩掌也􅚵音狃指頭著地處蒙頌猱狀郭云即蒙貴也狀如蜼而小紫黒色可畜健捕鼠勝於貓九眞日南皆出之猱亦獼猴之類猱蝯善授蝯即猨也援謂攀援樹木貜父善顧郭云貑貜也似獼猴而大色蒼黑能攫持人好顧盻或云即大猨也貜父音攫甫威夷長脊而泥泥奴細反弱也麔麚短脰贙有力贙呼阮反郭云西海大秦國有養者似狗多力獷惡豦迅頭郭云今建平山中有豦大如狗似獼猴黄黒色多髯鬛好奮迅其頭能舉石摘人貜類也豦音據蜼卬鼻而長尾狀似獼猴而大黄黑色尾長數尺似獺尾末有歧鼻露向上雨即自縣於樹以尾塞鼻或以兩指所在山中有之時善椉領椉登也領山嶺猩猩小而好啼人靣豕身長髮能言語好飲酒醉則人髠其髪為髪聲似小兒啼闕洩多狃狃指也此獸脚多指闕其越反寓屬謂此等獸為寓屬未詳何義或説多寄寓木上如此則自貍䝖已下方可言寓犀兕以前當應别有命恐失之鼢䑕音憤地中行者今竹根今人謂之竹䶉伯勞所化廣雅謂之鼹鼠鼸鼠刮沗反大戴禮云田䑕者鼸䑕也郭云以頰裏藏食者鼷䑕䑕之最小者郭云謂有螫毒者一説甘口鼠也鼶䑕音斯似鼬之䑕夏小正曰鼶鼬則穴葢九月也鼬鼠弋救反狀如䑕赤黄色大尾能啖䑕俗呼䑕狼江東呼為鼪即莊子云騏驥驊驑捕䑕不如貍鼪鼩䑕音劬小䑕也一名鼱鼩亦謂之鼩鼭鼠鼣䑕音時吠竝未詳鼫䑕音石郭云形大如䑕頭似尾有毛青黄色好在田中食粟豆關西呼為鼩䑕鼩音瞿鼤䑕鼨䑕音問終竝未詳豹文鼮䑕音廷常在樹上如䑕大其文似虎豹今深林中甚多漢武帝時得此鼠孝廉郎終軍知之賜絹百疋鼳䑕古覓反郭云今江東山中有鼳鼠狀如鼠而大蒼色在樹上音覡按郭氏此説又與鼮䑕相類䑕屬牛曰齝羊曰齛麋鹿曰齸皆謂食入肚中久則反吐出嚼之凡有角無前齒者皆然但命其所食之名或異爾郭云江東呼齝為齛呼咽為齸亦其義也齝丑之反齛齸音泄益鳥曰嗉咽中包食處寓鼠曰嗛謂猨猴之屬頰裏藏食嗛音琰齸屬獸曰釁奮迅毛骨人曰撟音矯伸引手足魚曰須張口鼓腮鳥曰狊張翅振翼古闃反須屬釋畜第十九騊駼馬音陶徒字林云北狄良馬也郭云色青野馬郭云如馬而小穆天子傳云野馬日走五百里駮如馬倨牙食虎豹倨即鋸也山海經云中曲山有獸如馬而身黑三尾一角音如鼔名駮食虎豹可以禦兵騉蹄趼善陞甗騉蹄者其蹄如趼秦時有騉蹄苑甗山嶺也郭云形似甑上大下小騉趼音昆硯騉駼枝蹄趼善陞甗枝蹄如牛蹄是也牛枝蹄馬溷蹄小領盜驪穆天子傳云天子駕八駿右盜驪左緑耳小領細頸也絶有力駥馬高八尺曰駥音戎膝上皆白惟馵四骹皆白驓四蹢皆白首前足皆白騱後足皆白翑前右足白啓左白踦後右足白驤左白馵駵馬白腹騵驪馬白跨驈白州驠尾本白騴尾白駺馰顙白顚白達素縣靣顙皆白惟駹骹膝下也蹢蹄也駵赤色驪黑色跨髀間也州竅也尾本尾根也尾根白曰騴尾毛白曰駺顛額上也素鼻莖也顙額也骹驓騱翑踦騵驈驠騴駺馰音敲繒奚劬欺刓聿燕晏郎的囘毛在膺宜乗在肘後減陽在幹茀方在背闋廣減廣音湛光囘毛旋毛也膺胸也幹脅也逆毛居馻音兖郭云馬毛逆刺騋牝驪牡鄭𤣥謂騋牝者色驪牡者色周禮復云七尺已上為騋據此文勢則騋指為馬色也當本玄説𤣥駒褭驂褭奴了反郭云𤣥駒小馬之别名牡曰騭牝曰騇郭云江東呼䭸馬曰騭騇音舍艸馬駵白駁黄白騜駵馬黄脊騝驪馬黄脊騽青驪駽青驪驎驒青驪繁鬛騥驪白雜毛駂黄白雜毛駓陰白雜毛駰蒼白雜毛騅彤白雜毛騢白馬黑鬛駱白馬黒脣駩黒喙騧一目白瞷二目白魚駵孫炎云赤色也青驪郭云今之鐵驄也青驪驎謂青黑二色相雜如魚鱗郭氏謂今之連錢驄是也駂郭云今之烏驄駓郭云今之桃花馬隂淺黒色也隂白雜毛郭氏謂今之泥驄蒼淺青色也彤赤色也喙口也凡此所言皆典籍所載之馬人咸不曉其毛物故此釋之騝騽音䖍習駽呼縣反驎良刃反驒騥駂駓騢駩瞷音陀柔保皮遐詮閑既差我馬荖擇也宗廟齊毫戎事齊力田獵齊足皆所須也荖音义馬屬犘牛犦牛犤牛犩牛犣牛犝牛犑牛犘音麻郭云出巴中重千斤犦音雹郭云即犎牛也領上肉犦胅起高二尺許如橐駝肉鞍一邊健者日行三百里今交州合浦徐聞縣出此牛按犎牛漢順帝時踈勒王來獻此犤音悲郭云庳小今之􅵈牛也又呼果下牛出廣州高涼郡犩音危郭云即犪牛也如牛而大肉數千斤出蜀中犣音獵郭云即旄牛也髀膝尾皆有長毛按此牛角向前毛白如雪其毛長今人以為拂子出荆夔間犝音重無角牛犑古覓反未詳何牛也角一俯一仰觭皆踊觢黑脣犉黑眥牰黑耳犚黑腹牧黑脚犈其子犢體長㸬絶有力欣犌觭音欺踊竪也謂角竪起觢音誓犉閏旬反眥才細反目匡也犚音尉犈音權體身也㸬匹外反犌音加牛屬羊牡羒牝牂吳羊也牡曰羒音墳夏羊牡羭牝羖郭云夏羊者黑羖䍽也樵疑今胡羊也多出夏州羭音俞然今人呼牡羊為羖音古角不齊觤音鬼角三觠羷音權險此謂羊角捲三匝者羳羊黄腹音煩未成羊羜直呂反郭云俗呼五月羔為羜絶有力奮羊屬犬生三猣二師一玂猣玂音宗祈未成毫狗郭云狗子未生㲦毛者長喙獫短喙猲獢駟鐡云載獫猲獢音見詩絶有力狣音兆尨狗也狗屬雞大者蜀蜀子雓郭云今蜀雞也雓音餘雞雛名未成雞僆郭云江東呼雞少者曰僆音練絶有力奮奮者鳥有力奮迅之名故雉雞皆云而獸畜亦可通謂也雞屬馬八尺爲駥牛七尺爲犉羊六尺爲羬彘五尺爲􅙊狗四尺爲獒雞三尺爲鶤駥音戎犉閏旬反羬五咸反􅙊鶤音厄昆六畜爾雅注卷下鄭樵爾雅注後序一字本一言一言本一義饘自饘餬自餬不得謂餬爲饘訊自訊言自言不得謂訊爲言襺自襺袍自袍不得謂袍爲襺袞自袞黻自黻不得謂袞爲黻不獨此也大抵動以十數言而總一義今舉此四條亦可知其昧於言理詩云奉璋峨峨謂助祭之士執圭璋峨峨然釋言峨峨祭也伐木丁丁丁丁者伐木聲也鳥鳴嚶嚶嚶嚶者烏聲也奈何曰丁丁嚶嚶相切直也舉此三條亦可知其不達物之情狀爾雅所釋盡本詩書見爾雅自可見不待言也離騷云令飄風兮先驅使涷雨兮灑塵故釋風雨云㬥雨謂之涷此句專爲離騷釋知爾雅在離騷後不在離騷前謂華爲荂謂艸木初生爲芛謂蘆笋爲虇音勸謂藕紹緒爲茭皆江南人語又知作爾雅者江南人謹後序舊有尔疋注什餘家如劉歆樊光李廵孫炎沈旋施乾謝􆀿諸子為尤著先軰病其漏畧湮而不傳惟郭景純攷采二九載詮成三卷最為稱首第晉代迄今幾千餘年况本文多江南人語而郭氏居河東古今世殊南北俗異意義音聲之間誠有未盡合者迨宋邢昺杜鎬九人疏之非不詳洽漁仲又懼後人舎經而疑箋注復舎箋注而泥已意别出手眼採經為證不畔作者本旨郭氏所謂擁篲清道企望塵躅者其在斯乎余家向藏抄本未甚精確客秋從錫山購得殘編數簏獨斯帙完好實南宋善版狂喜竟日亟授􅎚人其間淆訛如􅯘􅝁蔤密蚸鼫䶂之類一一更定又如弇同也葦醜芀蛭蟣倉庚黧黄也及由膝以下為掲由膝以上為渉由帶以上為厲數條俱已脱落未見其注何似不敢妄補始信落葉難埽雖宋刻不無遺憾云海虞毛晉識
