body:
  text: 欽定四庫全書爾雅注卷上宋鄭樵撰釋詁第一詁故也古人之言也故從言以古人之言於今有訛轉故作釋詁以五方之言於此有異同故作釋言然古人之言亦有五方之異五方之言亦有古今不同故釋詁釋言二篇雖各有注其義互通初哉首基肇祖元胎俶落權輿始也初衣始制也哉草木始生也首元皆人之首也肇始闢戶也祖人之先也胎孕形也俶初動作也落初隕也權輿胚胎未成亦物之始凡此皆始也可以文義求他有因音借字不可以文義求者難專泥此舊注引尚書三月哉生魄詩曰令終有俶又曰俶載南畝又曰訪豫落止又曰胡不承權輿林蒸天帝皇王后辟公侯君也賓之初筵曰有壬有林文王有聲曰文王蒸哉餘皆義之常行通見詩書𢎞廓宏溥介純夏幠厖墳嘏丕奕洪誕戎駿假京碩濯訏宇穹壬路淫甫景廢壯冢簡箌昄晊將業席大也𢎞洛誥云武王𢎞朕恭廓方言云張小使大謂之廓宏書曰若保宏父溥烈祖云我受命溥將介方言云東齊海岱之間謂之介純閟宫云天鍚公純嘏夏方言云自關而西秦晉之間凡物之壯大而愛偉之謂之夏幠巧言云亂如此幠厖駿商頌長發云為下國駿厖墳嘏方言云青幽之間凡土髙且大者謂之墳秦晉之間凡物壯大謂之嘏丕書云嘉乃丕績奕韓奕云奕奕梁山洪大誥云延洪惟我幼沖人誕生民云誕彌厥月戎方言云宋魯陳衛之間謂之嘏或曰戎京碩濯訏秦晉之間凡人大謂之奘燕之北鄙齊楚之郊或曰京齊宋之間曰碩荆吳揚甌之郊曰濯中齊西楚之間曰訏又文王有聲云王公伊濯又抑云訏謨定命宇覆六合也穹天之髙逺也壬賓之初筵云有壬有林路生民云厥聲載路淫有客云既有淫威甫齊風云無田甫田景濳云以介景福廢四月云廢為殘賊壯方言云秦晉之間凡人大謂之奘或謂之壯冢綿云乃立冢土簡執競云降福簡簡箌都角反韓詩云箌彼甫田又説文云箌草大也昄卷阿云爾土宇昄章晊日照之所及也將周頌云我將我享業大版也靈臺云虡業維樅席緇衣云緇衣之席兮幠厖有也郭云二者又為有也詩曰遂幠大東幠今本為荒迄臻極到赴來弔艐格戾懷摧詹至也迄生民云以迄于今臻泉水云遄臻于衛極樂記云及夫禮樂之極乎天赴雜記云凡赴於君來春秋云祭伯來弔小雅云神之弔矣艐讀為屆方言云齊楚之會郊曰懷宋曰屆摧大雅云先祖于摧詹采緑云六日不詹如適之嫁徂逝往也如春秋公及大夫朝聘皆書如之論語云之一邦適嫁徂逝皆方俗語方言云自家而出謂之嫁猶女出為嫁也逝秦晉語也徂齊語也適宋魯語也賚貢錫畀豫貺賜也賚錫有功善人也湯誓曰豫其大賚汝貢下與上也錫加錫也畀付與也干旄云何以畀之豫即與也貺惠與也彤弓云中心貺之儀若祥淑鮮省臧嘉令類綝彀攻榖介徽善也儀文王云儀刑文王若左傳宣三年民入山林不逢不若祥泰誓云襲于休祥淑鳲鳩云淑人君子鮮新臺云籧篨不鮮綝敕金反省綝彀郭氏未詳臧齊風云射則臧兮嘉抑云無不柔嘉令卷阿云令問令望類左傳云勤施無私曰類攻車攻云我車既攻穀小明云式穀以女介板云介人維藩徽思齊云大姒嗣徽音舒業順敘也謂次敘也舒業順敘緒也四者又為端緒怡懌悅欣衎喜愈豫愷康妉般樂也備見經典妉通作耽悅懌愈釋賓協服也皆謂悅服也釋無憾也賓懷德也遹遵率循由從自也自亦從也遹遵率循也三者又為循義循者不改作也靖惟漠圖詢度咨諏究如慮謨猷肇基訪謀也皆謂謀議也漠通作莫小雅云聖人莫之猷通作猶大雅云厥猶翼翼餘皆見詩郭氏云如肇未詳按肇即江漢云肇敏戎公如義未詳典彞法則刑範矩庸恆律戛職秩常也郭氏云庸戛職秩義見詩書餘皆謂常法耳柯憲刑範辟律矩則法也豳風云伐柯伐柯其則不遠謂執柯以取法也辟婢亦反下同辜辟戾罪也罪即罪也秦以罪似皇故改為罪黃髮齯齒鮐背耇老壽也黃髮髮白更黃也齯齒齒落重生者鮐背背皮有鮐魚文此皆壽徵耇方言云秦晉之郊陳兖之會謂老曰耇允孚亶展諶誠亮詢信也方言云齊魯之間曰允燕代東齊曰諶宋衛汝潁之間曰恂荆吳淮汭之間曰展西甌毒屋黃石野之間曰穆衆信曰諒周南召南衛之語也諶通作諶亮通作諒詬通作恂餘皆見詩展諶允愼亶誠也更相訓釋小雅云慎爾優遊謔浪笑敖戲謔也謔有不同而此四者所謂戲狎之謔也粵于爰曰也粵亦作越通作曰曰於也爰粵于也更相訓釋以曰通作粵故此言粵不言曰也爰粵于那都繇於也那左傳宣二年棄甲則那都虞書臯陶曰都繇卦兆之辭六者語韻之絶於即於乎歎聲也敆郃盍翕仇偶妃匹會也敆音閣説文云合會也盍周易豫之九四云勿疑朋盍簪郃未詳餘皆義之常仇讎敵妃知儀匹也仇周南云君子好仇讎廣雅云輩也知檜風云樂子之無知儀鄘柏舟云實維我儀妃合會對也對當也妃媲也媲比偶也譜計反皆更相訓釋紹胤嗣續纂緌績武係繼也緌綴紼者績續麻也皆有繼之義武大雅下武維周係亦作繫忥諡溢蟄愼貉謐顗頠密寧靜也忥音戲顗音疑頠魚毁反郭云忥顗頠未聞其義餘皆見詩傳按貉大雅云貊其德音貉貃通謐説文云靜語也隕隕湮下降墜摽蘦落也隕土曰隕隕石曰隕湮隕沒也摽召南云摽有梅蘦説文云草曰蘦木曰落亦通作零命令禧畛祈請謁訊誥告也禧未詳畛曲禮云畛於鬼神永悠迥違遐逖闊遠也迥大雅泂酌彼行潦迥泂同逖古文逖也牧誓云逖矣西土之人永悠迥遠遐也遐尤遠也虧壞圮垝毁也自毁曰虧乎怪反他毁曰壞音怪圯堯典云方命圯族又書序云祖乙圯于耿垝衛風云乘彼垝垣矢雉引延順薦劉繹尸旅陳也矢春秋經云公矢魚于棠繹賚云時周之命於繹思尸郊特牲云尸陳也雉順劉未詳尸職主也采蘋云誰其尸之巧言云職為亂階尸寀也舊注謂寀地非此即寮寀之寀故亦從寀而下文又申云寀寮官也左傳云同官為寮績緒采業服宜貫公事也宜鳧鷖云公尸來燕來宜貫碩鼠云三嵗貫女公酌云實維爾公允師永羕引延融駿長也引讀與文引之引同融方言云宋衛荆吳之間曰融羕未詳喬嵩崇高也崇充也崇又有充盛之義樂記曰復綴以崇犯奢果毅剋捷功肩堪勝也果毅左傳云殺敵為果致果為毅肩舍人云強之勝也堪亦作戡奢未聞勝肩戡劉殺克也轉相訓釋周頌云佛時仔肩劉獮斬刺殺也劉周書云咸劉厥敵獮秋殺獸也亹亹蠠沒孟敦勗釗茂劭勔勉也大雅云亹亹文王蠠沒猶黽勉也孟即暋也皆方俗之語有重輕耳釗方言云勉也秦晉曰釗自關而東周鄭之間曰勔釗齊魯曰勗兹也茂即懋也騖務昏暋強也騖馳騖務事務昏盤庚云不昏作勞暋康誥云暋不畏死強勉強也卬吾台豫朕身甫余言我也甫曲禮云授政任功曰豫一人畛於鬼神曰有某甫餘見詩書朕余躬身也身自已稱也張飛云身是張益德也台朕賚畀卜陽豫也卜天保云卜爾萬壽無疆陽魯詩云陽如之何申公謂陽子也據豫本豫我之豫又為賜豫之豫樵疑此當言台朕陽豫也謂我也賚畀卜豫也謂與也以二字同文故誤耳肅延誘薦餤晉寅藎進也肅曲禮云主人肅客延射義云子路出延射餤小雅云亂是用餤晉周易晉之彖曰晉進也藎文王云王之藎臣寅未詳羞餞迪蒸進也羞餞進飲食之名也迪進道也蒸豐年云蒸畀祖妣詔亮左右相導也亮通作涼大雅云涼彼武王詔相導左右助勴也勴音慮説文云助也此謂贊助也亮介尚右也介紹介也尚勸尚也右即佑也左右亮也郭氏云反覆相訓以盡其義緝熙烈顯昭皓熲光也周頌云學有緝熙于光明又曰休有烈光劼鞏堅篤掔虔膠固也掔説文苦間反疇孰誰也暀暀皇皇藐藐穆穆休嘉珍禕懿鑠美也暀暀音旺説文云光美也曲禮云天子穆穆諸侯皇皇嵩高云既成藐藐此連二文皆言美盛之貌餘皆義之常諧輯協和也關關噰噰音聲和也據二文一義者皆當在釋訓部恐誤在此協燮和也協古文協字燮洪範曰燮友柔克從申神加弼崇重也郭云隨從弼輔增崇皆所以為重疊神所未詳觳悉卒泯忽滅罄空畢罊殲拔殄盡也觳胡谷反郭云今直語耳罊苦計反説文云器中盡也苞蕪茂豐也揫斂屈收戢搜裒鳩樓聚也揫鄉飲酒云秋之言揫揫斂也屈泮水云屈此羣醜戢時邁云載戢干戈搜通作搜鳩左傳云以鳩其民樓通作摟肅齊遄速亟屢數迅疾也寁駿肅亟遄速也寁鄭風云不寁故也壑坑坑滕徵隍漮虗也坑有二文無義其一為衍者耳壑溪也坑塹也隍城池無水者漮音康方言云漮之言空也虗謂丘墟也疑徵為陊滕未詳黎庶蒸多醜師旅衆也皆見詩洋觀裒衆那多也洋溢也觀采緑云薄言觀者桑扈云受福不流差柬擇也皆見詩東與簡同戰栗震驚戁竦恐懾懼也痡瘏虺頽玄黃劬勞咎悴瘽愈鰥戮癙癵㾖癢疷疵閔逐疚痗瘥痱􅓠瘵瘼癠病也虺頽玄黃劬勞皆二文一命也咎罪病也瘽音勤癵力專反底音祁痗音妹鰥即瘝也戮郭云相戮辱亦恥病也閔傷病也逐衛風云碩人之軸箋云軸病也軸通作逐恙寫悝盱繇慘恤罹憂也恙聘禮云公問君賓對公再拜鄭注云拜其無恙寫車牽云我心寫兮寫謂有憂思散寫也悝十月云悠悠我悝盱卷耳及都人士云云何盱矣繇王風云中心搖搖繇通作搖倫勩卭敕勤愈庸疸勞也倫理也謂理事也勩小雅云莫知我勩卭巧言云維王之卭敕謹也愈心勞也庸功勞也或云愈即愈也勞來強事謂剪篲勤也來賚也謂賚其勤也強勉也事有所事也謂召南云逮其謂之剪篲未詳悠傷憂思也悠渭陽云悠悠我思思感思也懷惟慮願念惄思也思不忘也祿祉履戩祓禧禠祜福也履樛木云福履綏之戩天保云俾爾戩穀禋祀祠蒸嘗禴祭也禋祭天也祀祭總名也春祀夏禴秋嘗冬蒸儼恪祗翼諲恭欽寅熯敬也楚茨云我孔熯矣朝旦夙晨晙早也䇓俟替戾底止徯待也替戾底皆止也止亦待也噊幾災殆危也噊災未詳噊音聿􅠟汽也􅠟讀作剴説文云剴摩也汽民勞云汽可小康箋云汽幾也治肆古故也治疑為始肆故今也此各隨詩書之文有其義故展轉釋之惇亶祜篤掔仍肶埤笁腹厚也掔郭云掔然厚貌仍積肶輔埤益也笁與篤同古文工即馬字腹蓼莪云出入腹我載謨食詐偽也食湯誥云朕不食言郭氏謂載者言而不信謨者謀而不忠恐是臆説話猷載行訛言也郭云猷道也道亦言也載春官云作盟詛之載行即䛭瞋語也訛妖語也遘逢遇也遘逢遇遻也遻觸也音悟遘逢遇遻見也反覆欲盡義顯昭覲釗覿見也郭云逸書曰釗我周王監瞻臨蒞俯相視也鞠訩溢盈也節南山云降此鞠訩毛云鞠盈也訩無盈義但引文耳孔魄哉延虛無之言間也孔冗也魄虛中之形延即埏埏隧道也孔魄延虛無皆有間隙餘未詳瘞幽隱匿敝竄微也微謂晦藏不顯揚也訖徽妥懷安按替戾底廢尼定曷遏止也訖終妥安懷至安休替廢底住也皆有止之義焉按大雅云以按徂旅戾采菽云亦是戾矣底晉語云戾久將底底著滯淫誰能興之尼孟子云行或尼之曷者俗以抑止為曷今以逆相止為遏徽未詳豫射厭也豫怠也射即斁也烈績業也績勳功也功績質登平明考就成也質大雅云質爾人民登曲禮云年穀不登平榖梁傳云平者成也明有顯效也成者謂其有成迹梏梗較頲庭道直也梗即鯁亮之鯁較所謂較然也頲不屈也庭大田云既庭且碩道循理也梏未聞密康靜也豫寧綏康柔安也柔舜典云柔逺能邇平均夷弟易也謂易直也矢弛也弛易也易猶慢易也希寡鮮罕也罕亦希也鮮寡也寡直謂少耳酬酢侑報也飲酒之禮主人酌賓曰獻賓酌主人曰酢主人復酌賓曰酬公食大夫禮賔三飯之後公受宰夫束帛以侑是侑者亦主人所以報賓也毗劉暴樂也劉桑柔云捋采其劉暴音剝木枝踈落也樂即爍也毗未詳覭髳茀離也覭翳薈也髳蒙茸也茀荗盛也離謂草木披離覭音陌髳音蒙蠱諂二疑也蠱惑也諂謂讒諂也二心不一也楨翰儀幹也楨築牆所立兩木也翰牆兩邊障土者儀表儀也皆有體幹之義弼棐輔比俌也棐康誥云天畏棐忱俌猶輔也音甫疆界邊衛圉垂也衛營衛也圉拒邊也垂謂四垂也昌敵強應丁當也昌郭氏引虞書禹拜昌言浡肩搖動蠢迪俶厲作也浡所謂浡然也肩勝作也迪開作也俶始作也厲榖梁傳曰始厲樂矣兹斯咨呰已此也咨與兹同呰已與此皆音相近方俗之語有重輕耳嗟咨䰈也䰈讀與兔罝同郭云今河北人云䰈歎間狎串貫習也串皇矣云串夷載路習謂便習曩塵佇淹留久也塵積久也佇俟久也逮及暨與也公羊傳云會及暨皆與也騭假格陟躋登升也方言云魯衛地曰郅梁益之間曰􅛕騭即郅格即􅛕也假亦音格揮盝歇涸竭也揮振去水也盝即漉也月令云無漉陂池挋拭刷清也挋即振也清謂拂除令潔清也鴻昏於顯間代也代更代也鴻鴈知寒署之更代顯即明也昏明為晝夜之更代於更辭也間鄉飲酒云乃間歌魚麗注謂間代也饁餉饋也饋者遺以食也遷運徙也秉拱執也兩手持為拱廞熙興也周禮笙師云大喪廞其樂器熙虞書云庶績咸熙興謂興作衛蹶假嘉也今時俗訝其物則曰衛蹶與衛亦不相逺但方俗語有差耳假大雅假樂嘉成王也嘉者美之也廢稅赦舍也稅猶稅駕也舍置也棲遲憩休苦㕟齂呬息也棲止息也遲行息也憩恬息也休廕息也苦勞息也㕟齂呬皆氣息也㕟苦怪反齂訶戒反方言云東齊呼息為呬供峙具也峙費誓云峙乃糗糧􅤷憐惠愛也􅤷即憮也方言云韓鄭曰憮汝潁曰憐娠蠢震戁妯騷感訛蹶動也娠猶震也説文云妊娠動也戁長發云不戁不竦妯鼓鐘云憂心且妯騷常武云徐方繹騷訛無羊云或寢或訛也覆察副審也覆又按也副次長之稱契滅殄絶也左傳盡借邑人之車契軸契詰結反刻斷也郡臻仍乃侯乃也臻重至也乃即乃也侯維也維亦乃也乃引辭也不絶之義也郡未詳迪繇訓道也繇巧言云秩秩大猷繇即猷也僉咸胥皆也育孟耆艾正伯長也育邶谷風云既生既育耆艾曲禮曰五十曰艾服官政六十曰耆指使艾歷也謂長者更歷多矣歷秭算數也歷歷數也萬萬為億億億為秭歷傅也傅近也左傳庚辰傅于許艾歷覛胥相也艾即乂也察乂治也歷遍閲也覛音雇邪視也胥視也皆有相規之義乂亂靖神弗淈治也亂理亂也靖菀柳云俾豫靖之弗生民云茀厥豐草弗茀同淈書序作汨汨者擾而治之也神未詳頥艾育養也方言云汝潁梁宋之間曰艾汱渾隕墜也郭云汱渾皆水落貌際接翜捷也郭氏謂捷者相接續也翜所甲反其義未詳毖神溢慎也毖洛誥云夙夜毖祀溢周頌云假以溢我神未詳鬱陶繇喜也檀弓云人喜則斯陶陶斯詠詠斯猶猶即繇也注云陶鬱陶也馘穧獲也獲賊首曰馘獲禾曰穧阻艱難也難險難也剡㗉利也大田云以我耜載芟云有略其耜即剡略即㗉允任壬佞也允無所逆也任虞書云而難任人壬猶仕也俾拼抨使也大雅云荓云不逮拼荓同抨即拼也俾拼抨使隨也四者又有隨從之義儴仍因也君奭云襄我二人儴即襄也董督正也享孝也享小雅云享于祖考珍享獻也珍謂珍物宜獻也縱縮亂也郭云縱放掣縮皆亂法也探篡俘取也徂在存也徂鄭風云匪我思且且即徂也郭云以徂為存猶以亂為治以曩為嚮以故為今此皆詁訓義有反覆旁通美惡不嫌同名在存省士察也在虞書云在璿璣玉衡存即存也士者察刑之官烈枿餘也烈雲漢序云宣王承厲王之烈枿盤庚云若顛木之有由蘖蘖即枿也方言云秦晉衛之間曰蘖陳鄭之間曰烈迓迎也元良首也元從上從人其文象人身之首也良未聞薦摯臻也薦進也摯執也皆所以表至也賡揚續也賡虞書云乃賡載歌揚孝經云揚名於後世祔祪祖也祔謂附後死者合食於先祖祪毁廟之主即尼也尼女乙反近也尸子曰悅尼而來逺尼定也尼止也定亦止也邇幾昵近也昵小雅無自昵焉妥安坐也妥者安坐也貉縮綸也綸繩約也貉未詳貉嗼安定也大雅云貃其德音又云求民之莫貉貃嗼莫音義通伊維也伊維侯也侯六月云侯誰在矣時實是也時秦風云奉時辰牡實春秋實來公羊曰是來也卒猷假輟已也猷假未詳求酋在卒就終也求下武云世德作求酋卷阿云嗣先公爾酋矣在未詳崩薨無祿卒徂落殪死也徂落即虞書帝乃徂落釋言第二音發為言一音為一言釋詁者古言也格之以今釋言者今言也格之以正殷齊中也堯典云以殷仲春釋地云岠齊州以南斯誃離也陳風云斧以斯之小雅云哆兮侈兮侈即誃也謖興起也祭統云尸謖所六反還復返也宣徇遍也江漢云來旬來宣旬即徇也馹遽傳也左傳楚子乘馹又云使遽告於鄭皆傳車馹馬之名傳直戀反蒙荒奄也唐風云葛生蒙楚周南云葛藟荒之奄謂奄覆告謁請也皆求請也肅噰聲也周頌云肅噰和鳴格懷來也湯誓云格爾衆庶時邁云懷柔百神畛底致也曲禮云畛於鬼神左傳云底祿以德恀怙恃也恀即恃也小雅云無父何怙無母何恃律遹述也並見詩書律即聿字俞畣然也畣古答字然諾也豫臚敘也豫素備也臚漢書云典客秦官大初元年更名大鴻臚韋氏云鴻大也臚陳敘也敘謂陳敘庶幾尚也小雅云不尚息焉觀指示也周語云先王耀德不觀兵若惠順也敖憮傲也敖周頌云不吳不敖憮禮記云無憮無傲幼鞠稚也康誥云兄亦不念鞠子哀逸愆過也逸縱逸也亦通作佚疑休戾也書云疑謀勿成月令云百工休戾止也疾齊壯也郭云壯壯事謂速也悈褊急也悈與經始勿亟同音亟棘革詩傳並通為亟急之亟字貿賈市也厞陋隱也厞符佛反有司徹云厞用席遏遾逮也方言云東齊曰遏北燕曰遾音筮逮謂相及也征邁行也圯敗覆也覆傾覆也荐原再也周易坎之象云水荐至周禮禁原蠶者憮敉撫也憮音武愛撫也敉大誥云豫翼以于敉寧武圖功臞脙瘠也郭云齊人謂瘠瘦為脙臞音瞿脙音求桄熲充也桄孫叔然本作光是虞書云光被四表充盛也屢昵亟也亟數也昵者謂相親愛則恩信必頻數靡罔無也爽差也爽忒也差錯忒過也佴二也佴音餌二謂副二劑翦齊也郭云南方人呼翦刀為劑刀饙餾稔也報蒸曰饙復蒸曰餾稔熟也媵將送也送女曰媵將赴送也作造為也餥餱食也方言云陳楚之內相謁而食麥饘謂之餥音非餱乾食鞠究窮也窮索盡之也滷矜鹹苦也滷鹹滋味之苦矜者閔其辛苦也干流求也周南云左右流之流覃也覃延也轉相訓釋延及也佻偷也鹿鳴云視民不恌佻即佻也偷謂苟且濳深也濳深測也轉相訓釋測較水深淺穀鞠生也大車云榖則異室蓼莪云母兮鞠我啜茹也方言云吳越凡貪飲食者謂之茹茹虞度也邶柏舟云不可以茹左傳曰不備不虞度測度也試式用也誥誓謹也謹敕約也競逐強也強勉強也禦圉禁也禁制止也窒薶塞也七月云穹窒熏鼠大宗伯云以貍沈祭山林川澤黼黻彰也黼文如斧形刃白而身黑黻文如兩已相背以青黑線刺繡皆列於裳所以彰其衣服膺身親也皆謂躬親膺服膺也愷悌發也發行也謂所行之行也髦士官也畯農夫也農夫田官也主農之大夫也蓋割裂也蓋未詳雍支載也謝氏云雍字又作擁擁護支持皆載任之義諈諉纍也孫炎云楚人曰諈秦人曰諉纍相屬付也諈竹睡反諉女睡反漠察清也漠清貌清謂清明庇庥廕也郭云今俗呼樹蔭為庥榖履祿也履禮也隱占也郭謂隱度逆迎也憯曾也節南山云憯莫懲嗟增益也窶貧也薆隱也薆音愛薆鄣即隱蔽也僾唈也桑柔云亦孔之僾唈鳴唈也基經也經營其始基設也設陳也祺祥也祺吉也祥吉之先兆兆域也塋域肇敏也酒誥云肇牽車牛挾藏也史記秦有挾書之律郭云今江東通言挾浹徹也謂通潤也替廢也替滅也速徵也徵召也展轉訓釋以明義琛寶也探試也髦選也郭云俊士之選髦俊也郭云士中之俊如毛中之髦俾職也郭云使供職紕飾也干旄云素絲紕之淩栗也凌埤蒼作掕是栗戚也蠲明也潔而明也茅明也左傳前茅慮無明朗也猷圖也舂官以猷鬼神示之居謂圖畫也猷若也小星云實命不猷稱舉也稱通作稱稱好也稱適好也坎律銓也郭云易坎卦主法律皆所以銓量輕重矢誓也鄘柏舟云之死矢靡它舫舟也郭謂並兩船泳遊也遊浮水而不溺也逮及也冥幼也郭云幼稚者冥昧降下也傭均也節南山云昊天不傭敕容反強暴也窕肆也輕窕放肆肆力也郭云肆極力俅戴也絲衣云戴辨俅俅瘞幽也幽薶藏也氂罽也罽者織毛為之若今之毛氍毹以衣馬之帶鞅也烘燎也煁烓也白華云卭烘於煁煁三隅竈市針反陪朝也郭云陪位為朝康苛也苛謂苛刻樊藩也藩籬也賦量也量其所入粻糧也王制云五十異粻庶侈也庶幸也侈謂富庶之庶幸謂庶幾之庶築拾也金縢云凡大木所偃盡起而築之馬融謂起其木拾其禾也奘駔也郭云今江東呼大為駔駔猶粗也徂朗反集會也舫泭也漢廣云不可方思論語云乘桴浮於海舫即方泭即桴也方言云泭謂之棑棑謂之筏秦骨之通語也泭編竹木大曰筏小曰泭洵均也桑柔云菀彼桑柔其下侯旬毛傳云旬言陰均也洵即旬也洵龕也未詳逮遝也遝猶言遝至也是則也則法則畫形也謂形容其象賑富也郭氏謂隱賑富有局分也謂分域懠怒也板云天之方懠僁聲也言聲響僁僁然也音屑葵揆也采菽天子葵之揆度也商度逮及也惄飢也汝墳惄如調飢惄飢貌眕重也安重也左傳憾而能眕者鮮矣獵虐也獵必暴害禽獸土田也土已耕者曰田戍遏也遏止寇人師人也衆人曰人硈鞏也硈苦八反堅石也鞏固也棄忘也嚻間也郭云嚻然間暇貌五刀反謀心也心有所度也獻聖也謂聖者也里邑也謂邑居襄除也鄘風云不可襄也振古也載芟振古如兹箋云振亦古也懟怨也縭介也説文謂縭以絲介履號呼也叫呼凶咎也苞稹也郭云今人呼物叢緻者為稹逜寤也寐覺曰寤題也詩云麟之定顁即定也題額也猷肯可也陟岵云猷來無棄務侮也疑侮為敏貽遺也饋遺貿買也賄財也甲狎也芃蘭云能不我甲菼騅也菼薍也大車毳衣如菼毛云菼騅也蘆之初生者鄭云菼薍也名雖異皆指一物焉粲餐也緇衣云還豫授子之粲兮渝變也宜肴也郭氏引雞鳴云與子宜之夷悅也草蟲云我心則夷顚頂也頭上耊老也八十為耊輶輕也蒸民云德輶如毛俴淺也秦風云小戎俴收綯絞也絞縷為繩訛化也破斧云四國是訛跋躐也疐跲也豳風云狼跋其胡載疐其尾躐前倒跲後倒蒸塵也郭云人衆所以生塵垢戎相也相助也飫私也郭云宴飲之私孺屬也常棣云和樂且孺屬親也幕暮也郭云幕然暮夜煽熾也熾盛也柢本也柢音帝謂根本窕間也關雎窈窕淑女毛云窈窕幽間也淪率也謂相牽率雨無正云淪胥以鋪罹毒也慘毒撿同也撿範模也所出必同郵過也郭云道路所經過遜遁也斃踣也僨強也前覆曰踣却偃曰強畛殄也殄絶也疆畛所以絶界曷盍也虹潰也抑云實虹小子召旻云蟊賊內訌訌虹通隌暗也隌然𡨕昧貌音唵䵒膠也䵒女乙反孔甚也厥其也戛禮也郭氏謂常禮闍臺也鄭風云出其闉闍闍城門臺囚拘也攸所也展適也謂適當鬱氣也宅居也休慶也祈叫也郭云祈祭者叫呼而請事濬幽深也哲智也弄玩也尹正也正長也皇匡正也破斧云四國是皇服整也服御必整齊聘問也愧慙也殛誅也克能也翌明也金縢云翌日乃瘳訩訟也晦冥也奔走也逡退也疐仆也亞次也諗念也四牡云將母來諗屆極也謂至云弇蓋也謂覆蓋易曰惡積而不可掩掩弇同恫痛也握具也權輿云夏屋渠渠箋云屋具也握即屋字振訊也訊當作迅謂奮迅鬩恨也越揚也對遂也江漢云對揚王休燬火也方言有輕重故謂火為燬郭氏謂燬齊人語懈怠也宣緩也郭云謂寬緩遇偶也偶爾相值曩嚮也偟暇也偟亦作遑見詩宵夜也懊忨也謂愛忨音玩愒貪也榰柱也榰音枝説文云榰柱砥古用木今以石裁節也並併也卒既也既盡也慒慮也慒音囚將資也鵲巢云百兩將之將資裝也薾紩也郭云今人呼縫紩衣為薾薾音絺一作薾致恥反遞迭也迭更也矧況也廩廯也廣雅云廯倉也逭逃也太甲云自作孽不可逭訊言也間俔也間諜一名俔胡典反今謂細作是沄沆也水流漭沆干扞也自扞衛趾足也剕刖也剕扶味反斷足曰刖襄駕也堯典云懷山襄陵黍辱也燠暖也塊堛也土塊也一名堛將齊也楚茨云或肆或將糊饘也饘糜也啓跪也矏密也矏武延反密謂密緻開闢也袍襺也玉藻云纊為襺縕為袍纊新綿縕舊絮亦可通名皆謂綴綿絮於衣也障畛也左傳曰封畛土略靦姡也姡然面見人貌音滑鬻糜也舒緩也翢纛也翢即翿字纛舞者所持羽也今謂羽茠幢纛翳也舞者執纛所以自蔽翳隍壑也郭云城池空者為壑芼搴也郭氏謂拔取菜典經也威則也郭云威儀可法則苛妎也妎胡計反妒也芾小也召南云蔽芾甘棠芾小貌迷惑也狃復也狃伏前事而復為也逼迫也般還也左傳曰有般馬之聲亦作班班師則其義也班賦也郭氏謂布與疏引左傳使魯為其班即頒字也濟渡也濟成也濟益也廣訓異義緡綸也召南云維絲伊緡緡綸皆繩也郭氏云江東曰綸辟歷也辟今作劈歷過也漦盝也郭氏云漉漉出涎沫然則盝即漉也漦仕其反寬綽也袞黻也袞衣有黻文皇華也草木之華一名皇昆後也大禹謨云昆命于元龜彌終也生民云誕彌厥月釋訓第三訓者不可明言也但形容其義耳故此篇只釋詩之言貌狀後始及其説焉明明斤斤察也皆謂察貌條條秩秩智也郭云皆智思深長穆穆肅肅敬也諸諸便便辨也謂語言辨給肅肅翼翼恭也雍雍優優和也雍亦作雍雍雍兢兢憴憴戒也謂戒懼憴音繩戰戰蹌蹌動也謂聳動晏晏溫溫柔也謂和柔業業翹翹危也召旻云兢兢業業鴟梟云豫室翹翹惴惴憢憢懼也鴟梟云豫維音嘵嘵憢嘵通番番矯矯勇也桓桓烈烈威也洸洸赳赳武也藹藹濟濟止也謂容止番音波悠悠洋洋思也思而無所止貌蹶蹶踖踖敏也謂敏捷於事踖七夕反薨薨增增衆也蒸蒸遂遂作也郭云皆物盛興作之貌委委他他美也謂美麗忯忯惕惕愛也忯徒啓反惕防有鵲巢云心焉惕惕韓詩以為悅人故言愛也稱稱格格舉也郭氏謂舉持物蓁蓁孽孽戴也郭氏謂頭戴物懕懕媞媞安也小戎云懕厭良人懕即厭也媞音提安乃謂安靜之貌祁祁遲遲徐也丕丕簡簡大也存存萌萌在也萌存書作􅽪説文作蕄懋懋慔慔勉也慔即慕字庸庸慅慅勞也慅慅亦作草草赫赫躍躍迅也迅奮迅也綽綽爰爰緩也郭謂悠悠稱稱丕丕簡簡存存懋懋庸庸綽綽盡重語謂此數字單言之其義亦同但古人有重語者故復言之坎坎樽樽喜也據詩所言非喜義但喜躍而鼓舞也瞿瞿休休儉也旭旭蹻蹻憍也瞿居具反憍即驕反夢夢訰訰亂也謂暗亂訰即諄也懪懪邈邈悶也懪音雹儚儚洄洄惛也儚亡崩反版版蕩蕩僻也蕩即蕩也僻謂邪僻爞爞炎炎薰也居居究究惡也謂相憎惡仇仇敖敖傲也佌佌瑣瑣小也悄悄慘慘慍也痯痯瘐瘐病也殷殷惸惸忉忉慱慱欽欽京京忡忡惙惙怲怲奕奕憂也畇畇田也畟畟耜也郝郝耕也載芟云其耕澤澤郝即澤字繹繹生也載芟云驛驛其達繹即驛字穟穟苗也謂苗之茂綿綿穮也穮耘也挃挃穫也栗栗衆也溞溞淅也烰烰蒸也生民云釋之叟叟蒸之浮浮溞即溲烰即浮也俅俅服也謂服戴峨峨祭也謂執圭璋助祭鍠鍠樂也穰穰福也子子孫孫引無極也顒顒卬卬君之德也丁丁嚶嚶相切直也謂伐木丁丁鳥鳴嚶嚶此言朋友相切正藹藹萋萋臣盡力也噰噰喈喈民協服也並見卷阿佻佻契契愈遐急也愈急遐長也謂益長急切宴宴粲粲尼居息也尼近也居息謂優間哀哀悽悽懷報德也悽悽即出車云卉木萋萋倏倏嘒嘒罹禍毒也小辨云踧踧周道踧亦作倏晏晏旦旦悔爽忒也皋皋㻆㻆刺素食也大東云鞙鞙佩璲㻆即鞙也歡歡愮愮憂無告也板云老夫灌灌王風云中心搖搖歡即灌愮即搖也憲憲泄泄制法則也泄亦作泄謔謔謞謞崇讒慝也謞亦作熇翕翕訿訿莫供職也速速蹙蹙惟逑鞠也惟念逑及窮迫也念及窮迫也抑抑密也謂密緻秩秩清也謂清明甹夆掣曵也小毖云莫豫荓蜂甹夆即荓蜂朔北方也不俟不來也郭云不可待是不復來也不遹不迹也郭云言不循軌迹也不徹不道也不順乎道勿念勿忘也萱諼忘也伯兮云焉得諼草諼本作萱考槃云永矢弗諼每有雖也常棣云每有良朋饎酒食也舞號雩也雩請雨之祭有舞有號暨不及也公羊云及我欲之暨不得已也是不得及蠢不遜也采菽云蠢爾蠻荆如切如磋道學也如琢如磨自修也瑟兮僴兮恂栗也赫兮咺兮威儀也有斐君子終不可諼兮道盛德至善民之不能忘也既微且腫骭瘍為微腫足為腫骭下患反是刈是濩濩煮之也以鑊煮葛為絺綌履帝武敏武迹也敏拇也拇大指張仲孝友善父母為孝善兄弟為友有客宿宿言再宿也有客信信言四宿也美女為媛美士為彥其虗其徐威儀容止也猗嗟名兮目上為名式微式微者微乎微者也之子者是子也徒御不驚輦者也諸徒皆為徒行此獨為輦也輦挽車袒裼肉袒也暴虎徒摶也郭云空手執也馮河徒涉也郭云無舟楫籧篨口柔也戚施面柔也夸毗體柔也柔弱順也婆娑舞也辟拊心也謂椎胸矜憐撫掩之也緎羔裘之縫也殿屎呻也呻吟幬謂之帳小星云抱衾與裯裯即幬也箋云幬牀帳侜張誑也誰昔昔也不辰不時也凡曲者為罶罶曲粱也凡以薄取魚為罶鬼之為言歸也尸子曰古者謂死人為歸人釋親第四父為考母為妣曲禮云生曰父母妻死曰考妣嬪郭氏謂此六者生死通稱元無别異引周書傳以為據其義甚明父之考為王父父之妣為王母王父之考為曾祖王父王父之妣為曾祖王母曾祖王父之考為高祖王父曾祖王父之妣為高祖王母父之世父叔父為從祖祖父父之世母叔母為從祖祖母父之晜弟先生為世父後生為叔父男子先生為兄後生為弟男子謂女子先生為姊後生為妹父之姊妹為姑父之從父晜弟為從祖父父之從祖晜弟為族父族父之子相謂為族晜弟族晜弟之子相謂為親同姓兄之子弟之子相謂為從父晜弟子之子為孫孫之子為曾孫曾孫之子為玄孫玄孫之子為來孫來孫之子為晜孫晜孫之子為仍孫仍孫之子為雲孫王父之姊妹為王姑曾祖王父之姊妹為曾祖王姑高祖王父之姊妹為高祖王姑父之從父姊妹為從祖姑父之從祖姊妹為族祖姑父之從父晜弟之母為從祖王母父之從祖晜弟之母為族祖王母父之兄妻為世母父之弟妻為叔母父之從父晜弟之妻為從祖母父之從祖晜弟之妻為族祖母父之從祖祖父為族曾王父父之從祖祖母為族曾王母父之妾為庶母祖王父也晜兄也凡此所命或有義或無義但取稱呼之異爾曰考曰妣以言尊老也曰子曰孫以别繼承也曰高曰曾以别上之近遠曰曾曰玄曰來曰晜曰仍曰雲以别下之近遠曰世曰叔曰晜曰弟以别旁出之長幼曰姊曰妹曰姑以别女子之長幼先後曰王以言其尊而大曰庶以言其卑而衆曰從以别正曰親以别遠曰族以别宗宗族母之考為外王父母之妣為外王母母之王考為外曾王父母之王妣為外曾王母母之晜弟為舅母之從父晜弟為從舅母之姊妹為從母從母之男子為從母晜弟其女子子為從母姊妹黨妻之父為外舅妻之母為外姑下言謂我舅者吾謂之甥是則壻亦可謂之甥故孟子曰帝館甥于二室姑之子為甥舅之子為甥妻之晜弟為甥姊妹之夫為甥今人呼姊妹之子為甥敵體相呼為生而此皆作甥其實甥生一也妻之姊妹同出為姨同出謂俱已嫁然則未嫁者不容相呼也女子謂姊妹之夫為私碩人云談公維私男子謂姊妹之子為出襄五年公羊曰蓋舅出也女子謂晜弟之子為姪左傳曰姪其從姑今男子謂晜弟之子亦然據古人謂兄弟之子其男子為子其女子為姪故姪之字從女此本義也後人訛則通謂姪謂出之子為離孫謂姪之子為歸孫女子子之子為外孫女子同出謂先生為姒後生為娣同出謂俱嫁一夫公羊傳曰諸侯娶一國二國往媵之以姪娣從女子謂兄之妻為嫂弟之妻為婦今男子亦通謂嫂婦長婦謂稚婦為娣婦娣婦謂長婦為姒婦世人多惑斯文以兄妻呼弟妻為娣弟妻呼兄妻為姒考之古義兄弟之妻既為敵體故不以兄弟之長幼相命但以年長於已則呼之為姒年少於已則呼之為娣左傳穆薑謂聲伯之母為姒叔向之嫂謂叔向之妻為姒是皆呼夫弟之妻也知此所謂長婦稚婦者實以婦人之長稚也妻黨婦稱夫之父曰舅稱夫之母曰姑姑舅在則曰君舅君姑沒則曰先舅先姑謂夫之少母為少姑夫之兄為兄公夫之弟為叔夫之姊為女公夫之女弟為女妹子之妻為婦長婦為嫡婦衆婦為庶婦女子子之夫為壻壻之父為姻婦之父為婚父之黨為宗族母與妻之黨為兄弟婦之父母壻之父母相謂為婚姻兩壻相謂為亞郭氏云詩曰瑣瑣姻亞今江東人呼同門為僚壻婦之黨為婚兄弟壻之黨為姻兄弟嬪婦也謂我舅者吾謂之甥也婚姻爾雅注卷上
