body:
  text: 欽定四庫全書經部十爾雅鄭注小學類一訓詁之屬提要臣等謹案爾雅鄭注三卷宋鄭樵撰樵字漁仲莆田人居夾漈山中因以為號又自稱西溪逸民紹興間以薦召對授右迪功郎兵部架閣尋改監潭州南嶽廟給札歸鈔所撰通志書成入為樞密院編修南宋諸儒大抵崇義理而疏考證故樵以博洽傲睨一時遂至肆作聰明詆諆毛鄭其詩辨妄一書開數百年杜撰説經之捷徑為通儒之所深非惟作是書乃通其所可通闕其所不可通文似簡略而絶無穿鑿附會之失於説爾雅家為善本中間駁正舊文如後序中所列饘糊訉言襺袍衮黼四條峩峩丁丁嚶嚶二條注中所列釋詁台朕陽之豫為我賚畀卜之豫為與一條閲閲噰噰當入釋訓一條釋親據左傳辨正娣姒一條釋天謂景風句上脫文一條星名脫實沈鶉首鶉尾三次一條釋水天子造舟一條釋魚鯉鱣一條釋蟲食根蟊一條蝮虺首大如臂一條皆極精確惟魚謂之丁一條務牽引假借以就其六書略之説據涷雨二字謂爾雅作於離騷後又堅執作爾雅者江南人凡郭璞所云蜀語河中語者悉駁辨之是則偏僻之過習氣猶未盡除别白觀之可矣乾隆四十五年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀爾雅鄭注序大道失而後有六經六經失而後有爾雅爾雅失而後有箋注爾雅與箋注俱奔走六經者也但爾雅逸箋注勞爾雅者約六經而歸爾雅故逸箋注者爾雅以投六經故勞有詩書而後有爾雅爾雅馮詩書以作往往出自漢代箋注未行之前其孰以為周公哉爾雅釋六經者也爾雅明百家箋注皆可廢爾雅應釋者也箋注不應釋者也人所不識者當釋而釋之曰應釋人所不識者當釋而不釋所識者不當釋而釋之曰不應釋古人語言於今有變生今之世何由識古人語此釋詁所由作五方言語不同生於夷何由識華語此釋言所由作物有可以理言者以理言之有不可以理言但喻其形容而已形容不可明故借言之訓以為證此釋訓所由作宗族婚姻稱謂不同宫室器樂命名亦異此釋親釋宫釋器釋樂所由作人之所用者人之事爾何由知天之物此釋天所由作生於此土識此土而已九州之遠山川丘陵之異何由歷此釋地釋丘釋山釋水所由作動物植物五方所産各有名古今所名亦異謂此釋草釋木釋蟲釋魚釋鳥釋獸釋畜所由作何物為六經集言語稱謂宮室器服禮樂天地山川草木蟲魚鳥獸而為經以義理行乎其間而為緯一經一緯錯綜而成文故曰六經之文爾雅謂言語稱謂宮室器服禮樂天地山川草木蟲魚鳥獸之所命不同人生不應識者也故為之訓釋義理者人之本有人生應識者也故嬰兒知好瞽者聾者知信義不馮文字而後顯不藉訓釋而後知六經所言早為長物何況言下復有言哉故爾雅則不釋焉後之箋注家反是於人不應識者則略應識者則詳舍經而從緯背實以應虛致後學昧其所不識而妄其所識也蓋人所不應識者經也實也不得釋則惑得釋則明若曰關關雎鳩在河之洲不得釋則人知雎鳩為何禽河洲為何地哉人所應識者緯也虛也釋則不顯不釋則顯董遇有言讀百遍理自見者為此也若雎鳩河洲不得旨言雖千誦何益哉何謂釋則不顯且如論語所謂學而時習之不亦説乎無箋注人豈不識孟子所謂亦有仁義而已矣何必曰利無箋注人豈不識中庸所謂天命之謂性率性之謂道無箋注人豈不識此皆義理之言可詳而知無待注釋有注釋則人必生疑疑則曰此語不徒然也乃舍經之言而泥注解之言或者復舍注解之意而泥已之意以為經意故去經愈遠正猶人夜必寢旦必食不須告人也忽而告人曰吾夜已寢矣旦已食矣聞之者豈信其直如此耳必曰是言不徒發也若夜寢旦食又何須告人先儒箋解虛言致後人疑惑正類此因疑而求因求而迷因迷而妄指南為北俾日作月欣欣然以為自得之學其實沈淪轉徙可哀也哉此患無他生於疑爾其疑無他生於本來識者而作不識者解爾爾雅訓釋六經極有條理然只是一家之見又多徇於理而不逹乎情狀故其所釋六經者六經本意未必皆然樵酷愛其書得法度今之所注只得據爾雅意旨所在因採經以為證不可叛之也其於物之名大有拘礙處亦略為之托正云爾謹序
