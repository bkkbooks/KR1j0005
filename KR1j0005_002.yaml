body:
  text: 欽定四庫全書爾雅注卷中宋鄭樵撰釋宮第五凡棟宇之屬皆以釋宮總之白虎通云黃帝作宮室世本曰禹作宮室宮謂之室室謂之宮互名也牖戶之間謂之扆牖東户西也以其設斧扆於其處故名之曰扆覲禮云天子設斧扆於戶牖之間其內謂之家自扆以內明所居也東西牆謂之序牆今謂之壁此則室前堂上東西廂之牆也西南隅謂之奧古者室戶不當中而近東則西南隅最為隱奧之處祭祀及尊者所居西北隅謂之屋漏抑云尚不愧於屋漏東北隅謂之宧飲食之所音夷東南隅謂之窔既夕禮云掃室聚諸窔音要柣謂之閾棖謂之楔楣謂之梁樞謂之椳樞達北方謂之落時落時謂之􅩖閾門限楔苦黠反門兩旁長木楣門戶上橫木所以跨楔者樞門闔戶扉開闢之機也其持樞之窠臼必連北棟以為固􅩖音士落時之别名垝謂之坫坫有二明堂位及論語所謂反坫者在兩楹之間以土為之此所謂坫者在堂之隅其東南隅為東坫西南為西坫故郭氏云在堂隅坫㙐也㙐即堂角端牆謂之墉露牆也鏝謂之杇泥牆之鏝椹謂之榩今亦謂之椹郭云斫木櫍也地謂之黝黑飾地也於糾反牆謂之堊白飾牆也於故反樴謂之杙在牆者謂之楎在地者謂之臬大者謂之棋長者謂之閣此别杙所在長短之名杙橛也音弋樴徒得反闍謂之臺有木者謂之榭闍音都臺積土為之榭加屋焉雞棲於弋為榤鑿垣而棲為塒此釋君子于役之詩也植謂之傳傳謂之突植者立木於門中所以鍵固管鑰杗廇謂之梁其上楹謂之棁閞謂之槉栭謂之楶棟謂之桴桷謂之榱桷直而遂謂之閲直不受簷謂之交簷謂之樀此别梁棟之屬杗音亡廇力又反梁屋大梁也楹柱也上楹梁上短柱一名棁一名侏儒柱閞亦作㭓一名枅一名㭼一名欂一名槉柱上方木是也栭即櫨也欂櫨謂斗栱也棟屋檼也今謂之桁桴音浮桷椽也椽長直而遂達五架屋際者曰閲若五架屋際椽不直上於簷而交於檼上者曰交簷一名屋梠一名宇皆屋之四垂也容謂之防射時唱獲者所以蔽身之具一名乏郭云形如今牀頭小曲屏風也連謂之簃郭氏謂堂樓閣邉小屋今呼之簃厨連觀也丈知反屋上簿謂之筄音曜即屋笮兩階間謂之鄉中庭之左右謂之位門屏之間謂之寧屏謂之樹此别君臣位之所也鄉南鄉位列位寧門內兩孰之間也實人君視朝所寧立之處樹立小牆當門中以自蔽閍謂之門正門謂之應門觀謂之闕宮中之門謂之闈其小者謂之閨小閨謂之閣弄門謂之閎門側之堂謂之孰橛謂之闑闔謂之扉所以止扉謂之閎此别門闕之異也閍亦作祊楚茨云祝祭于祊即廟門也其路門之外受朝正門一名應門應門之外門曰雉門雉門之旁雙闕曰觀一名象魏闈即宫中相通之小門名也闈之小者曰閨閨之小者曰閣弄首之門曰閎門側之堂夾門東西者曰孰門中之橛名闑短橛也所以止闔向外闔門扇也於門兩旁立長橛所以止扉自奄者亦曰閎瓴甋謂之甓甎也宮中弄謂之壼廟中路謂之唐堂途謂之陳路旅途也路場猷行道也一達謂之道路二達謂之歧旁三達謂之劇旁四達謂之衢五達謂之康六達謂之莊七達謂之劇驂八達謂之崇期九達謂之逵此别途路之異也弄宫中道名故後宫稱永巷陳者自堂至門所行之處也路旅二者途之異名路場猷行四者復是道之異名也劇旁郭云今南陽冠軍樂鄉數道交錯俗呼五劇鄉劇驂云三道交復有一歧出者今北海劇縣有此道室中謂之時堂上謂之行堂下謂之步門外謂之趨中庭謂之走大路謂之奔此皆人之行步緩急之所因以名云隄謂之梁石杠謂之徛梁徛皆渡水之道梁以木或以石橫絶水上也徛音寄彴也置石於水中以為步渡室有東西廂曰廟無東西廂有室曰寢無室曰榭四方而高曰臺陜而修曲曰樓凡太室有東西廂夾室及前堂有序牆者曰廟但有太室者曰寢廟居前寢居後榭有二臺上架木曰榭屋歇前亦曰榭築土曰臺臺上有屋曰樓陜狹也音狹狹修長也釋器第六器服一體故釋器而該服焉因器而又及飲食之屬木豆謂之豆竹豆謂之籩瓦豆謂之登木豆薦菹醢竹豆薦棗栗菱芡脯修糗餌之屬瓦豆薦羹皆祭祀燕享所用盎謂之缶缶瓦盆也甌瓿謂之瓵郭云瓿甊小罌長沙謂之瓵瓿蒲口反瓵音移康瓠謂之甈瓠臺也甈音契斪斸謂之定廣雅云定謂之耨亦謂之鎛藝器也類鉏其柄長尺耨六寸所以間稼藝苖斪音衢定多佞反斫謂之鐯張略反钁也實大鉏􅯘謂之疀􅯘音鍬疀音插即鍤也亦謂之鍬緵罟謂之九罭九罭魚罔也嫠婦之笱謂之罶罺謂之汕篧謂之罩槮謂之涔鳥罟謂之羅罟謂之罝麋罟謂之罞彘罟謂之羉魚罟謂之罛繴謂之罿罿罬也罬謂之罦罦覆車也此别網罟之異也緵子弄反罟網也九罭九囊之網以簿為魚笱其功易故號寡婦之笱也罺撩罟也謂摝取之也篧土角反罩捕魚籠槮桑感反聚柴木於水中以棲魚羅覆張之網也罝罞羉皆遮截之網罞音茅羉音鸞罛最大之網覆車翻車也有兩轅中施罥以掩鳥一名繴音壁一名量音衝一名音拙一名罦音浮絇謂之救絇具位仄屨頭飾也救絲為之律謂之分律管可以分候大版謂之業繩之謂之縮之業築牆版繩以縮之彞卣罍器也小罍謂之坎皆盛酒之尊彝為上尊卣為中尊為下尊坎其小者耳衣裗謂之䘽黼領謂之襮緣謂之純袕謂之褮衣眥謂之襟衱謂之裾襟謂之袸佩襟謂之褑執衽謂之袺扱衽謂之襭衣蔽前謂之襜婦人之褘謂之縭縭緌也裳削幅謂之纀此别衣服之異也裗音流䘽音倪衣縷也謂縫也黼領刺繡斧文於衣領襮音博緣余絹反邊際緣飾也袕音穴衣開孔也謂鬼衣也褮音營襟交領也衱音劫裾衣後裾也襟衣小帶也袸音荐褑音院佩玉之帶也衽裳際也執謂執於手扳謂扱於帶間襜蔽膝也一名韠褘婦人香纓也邪交絡帶繫於體緌繫也纀音卜深衣之裳削殺其幅輿革前謂之鞎後謂之笰竹前謂之禦後謂之蔽環謂之捐鑣謂之钀載轡謂之轙轡首謂之革此别車馬所飾之異也以韋靶車軾曰鞎以韋靶後戶曰笰以簟衣軾曰禦以簟衣後戶曰蔽捐著車衆環也钀魚列反馬勒旁鐵轙音儀車軛上環所以貫轡也革以革為轡也餀謂之餯食饐謂之餲摶者謂之糷米者謂之糪肉謂之敗魚謂之餒此别食物臭敗之名也餀呼蓋反許穢反猶然也謂其自蒸敗也食飯也饐敗臭也摶謂飯已涎黏成摶糷音爛檗飯半腥半熟也音壁肉曰脫之魚曰斫之脫謂脫皮毛斫削也謂削鱗鬛冰脂也謂肌膚脂澤若氷雪然此釋莊子所謂肌膚若冰雪也肉謂之羹魚謂之鮨肉謂之醢有骨者謂之臡此别以魚肉食為之異也羹肉臛也據公食大夫禮鮨則鮓也音祁觀此文勢上下相敵則鮨又類於湇屬醢臡皆醬也臡音泥康謂之蠱澱謂之垽康今作粳澱即澄泔之澤音殿垽魚靳反鼎絶大謂之鼐圜弇上謂之鼒附耳外謂之釴􅍁足謂之鬲弇上斂口也附耳在鼎表者曰釴音亦􅍁足謂張足也甑謂之鬵鬵鉹也鬵音尋郭云涼州呼甑曰鉹音侈璲瑞也大東云鞙鞙佩璲箋云佩璲者以瑞玉為佩玉十謂之區雙玉曰玨五玨為區羽本謂之翮鳥羽之根一羽謂之針十羽謂之縳百羽謂之緷别羽數多少之名周官羽人所言與此小異縳音篆緷音衮木謂之虡縣鐘磬之木橫曰筍植曰虡旄謂之旄牛尾也舞者所執音卑菜謂之蔌䔩音逑菜茹之總名白蓋謂之苫白茅苫也茅之蓋屋必為苫故曰白蓋黃金謂之璗其美者謂之鏐白金謂之銀其美者謂之鐐鉼金謂之鈑錫謂之鈏此别金錫之異名也璗音蕩鏐音留鐐音遼鉼音餅鈑即供金鈑謂旅于上帝則供金鈑音版鈏音丈引之引象謂之鵠角謂之觷犀謂之剒木謂之剫玉謂之雕此别其治朴之名朴未成器也觷音嶽剒音錯剫音鐸金謂之鏤木謂之刻骨謂之切象謂之磋玉謂之琢石謂之磨此皆治而為器之别名璆琳玉也二者美玉之名簡謂之畢簡札也古未有紙載文於竹簡不律謂之筆緩聲為不律急聲為筆郭云蜀人呼筆為不律許慎云吳人謂之不律觀作爾雅者多用江南音命物恐許氏之言是矣滅謂之點以筆滅字也絶澤謂之銑銑金之最有光澤者金鏃剪羽謂之鍭骨鏃不剪羽謂之志鏃箭頭也弓有緣者謂之弓無緣者謂之弭以金者謂之銑以蜃者謂之珧以玉者謂之圭緣纏也有以纏束而漆之者有不用纏束而不漆者金蜃玉三者皆可飾弓兩頭因取其類以為名耳蜃蚌也珧音姚圭大尺二寸謂之玠璋大八寸謂之琡璧大六寸謂之宣肉倍好謂之璧好倍肉謂之瑗肉好若一謂之環此别圭璧之屬也圭璧皆所執之玉圭類笏璋半圭也璧狀如大環宣即漢郊祀志所謂有司奉瑄玉是也肉邊也好呼報反孔也執璧必手拏其孔繸綬也即佩玉之組所以連繫瑞玉者因通謂之繸以其所佩之玉曰璲故云然一染謂之縓再染謂之赬三染謂之纁青謂之蔥黑謂之黝斧謂之黼此别色之異也縓七戀反紅色赬赤色纁絳色蕙淺青色黝黑色黼畫斧形邸謂之柢邸人之所止也柢乃木之根本是亦其所止也故邸可謂之柢雕謂之琢治玉之名蓐謂之茲茲蓐席也桓十六年公羊傳曰屬負茲竿謂之箷以竿為衣架曰箷音移簀謂之第簀薦下竹簿第側使反革中絶謂之辨革中辨謂之韏皮去毛曰華中斷之曰辨復中分其辨則曰韏音眷鏤鎪也刻鋖物為鎪蘇婁反卣中尊也不大不小者釋樂第七宮謂之重商謂之敏角謂之經徵謂之迭羽謂之柳此釋五音之異名也大瑟謂之灑瑟登歌所用之樂郭云長八尺一寸廣一尺八寸二十七絃大琴謂之離廣雅云琴長三尺六寸六分五絃此古制也後人加少宮少商二絃是為七絃也大琴之制未聞或曰二十七絃大鼓謂之鼖小者謂之應鼖長八尺革四尺應小鼓蓋鼙之屬在大鼓側大磬謂之毊郭云毊形似犂錧以玉石為之錧犂曲刃也馨虗驕反大笙謂之巢小者謂之和笙斬匏為底其中列管施簧於管端故謂笙為匏亦謂之簧也大者十九簧小者十三簧簧管中之金薄鐷也大篪謂之沂郭云篪以竹為之長尺四寸圍三寸一孔上出寸三分名翹橫吹之小者尺二寸廣雅云八孔沂音銀大塤謂之嘂塤亦作塤音喧燒土為之大如鵝子鋭上平底形如稱錘六孔小者如雞子大鍾謂之鏞其中謂之剽小者謂之棧鏞亦謂之鑮東晉會稽剡縣人家井中得一鐘長三寸口徑四寸上有銘古文云棧剽音瓢棧音盞大簫謂之言小者謂之筊簫一名籟大者編二十三管長尺四寸無底小者十六管長尺二寸有底筊音爻大管謂之簥其中謂之篞小者謂之篎管如笛形小併兩管而吹之大者曰簥音嬌不大不小者曰篞乃結反小者曰篎音眇大籥謂之産其中謂之仲小者謂之箹郭云籥如笛三孔而短廣雅云七孔毛氏詩傳云六孔是則其制有不同者耳箹音渥徒鼓瑟謂之步徒吹謂之和徒歌謂之謡徒擊鼓謂之咢徒鼓鍾謂之修徒鼓磬謂之寋徒獨也和胡臥反寋音蹇所以鼓柷謂之止所以鼓敔謂之籈合樂用柷止樂用敔柷如漆桶方二尺四寸深尺八寸中有椎柄合樂之時投椎於桶中而撞之止者其椎之名也敔如伏虎背上有二十七鉏鋙籈用篦櫟之遂止樂音真大鼗謂之麻小者謂之料鼗如鼓而小持其柄搖之旁耳還自擊料音聊和樂謂之節節相也樂記云治亂以相注云相即柎也亦以節樂以韋為囊而實以粳釋天第八穹蒼蒼天也桑柔云以念穹蒼春為蒼天夏為昊天秋為旻天冬為上天四時春為青陽夏為朱明秋為白藏冬為玄英四時和謂之玉燭春為發生夏為長嬴秋為收成冬為安寧四時和為通正此五者又其别號也謂之景風據下文敵體則此上容有二句亡焉甘雨時降萬物以嘉謂之醴泉言甘雨降萬物嘉則地出醴泉醴泉者泉水味甘如醴祥榖不熟為飢蔬不熟為饉果不熟為荒仍飢為荐災太歲在甲曰閼逢在乙曰旃蒙在丙曰柔兆在丁曰強圉在戊曰著雍在己曰屠維在庚曰上章在辛曰重光在壬曰玄黓在癸曰昭陽著直略反歲陽太嵗在寅曰攝提格在卯曰單閼在辰曰執徐在已曰大荒落在午曰敦牂在未曰協洽在申曰涒灘在酉曰作噩在戍曰閹茂在亥曰大淵獻在子曰困敦在丑曰赤奮若載嵗也夏曰嵗商曰祀周曰年唐虞曰載涒湯昆反閹音掩困敦音頓嵗名月在甲曰畢在乙曰橘在丙曰修在丁曰圉在戊曰厲在己曰則在庚曰窒在辛曰塞在壬曰終在癸曰極塞先北反月陽正月為陬二月為如三月為寎四月為余五月為臯六月為且七月為相八月為壯九月為玄十月為陽十一月為辜十二月為塗陬側留反寎音柄且子余反相息亮反月名南風謂之凱風東風謂之谷風北風謂之涼風西風謂之泰風桑柔云泰風有隧焚輪謂之頽扶搖謂之猋皆暴風也焚輪自上而下扶搖自下而上風與火為庉庉熾盛貌徒衮反回風為飄回旋也日出而風為暴風而雨土為霾陰而風為曀此並釋終風辭也天氣下地不應曰雺地氣發天不應曰霧霧謂之晦雺即蒙也音蒙洪範曰蒙常風若雺謂蒙昧晦謂晦冥螮蝀謂之雩螮蝀虹也霓為挈二弇日為蔽雲雄曰虹色鮮明雌曰霓色黯挈二文見尸子虹霓朝見西暮見東日中則見天中故暈氣弇日疾雷為霆霓謂霹靂也雨霰為霄雪霰亦作霰霰氷雪雜下故謂之消雪霄即消也暴雨謂之涷小雨謂之霡霂久雨謂之淫淫謂之霖濟謂之霽涷音東郭云江東呼夏月暴雨為涷雨左傳云雨自三日已往為霖霽雨止也風雨壽星角亢也二十八宿起於角亢亢音剛天根氐也天駟房也房為天馬主車駕故亦為天駟大辰房心尾也大火謂之大辰大火心星析木謂之津即漢津箕斗之間漢津也箕龍尾斗南斗天漢之津梁星紀斗牽牛也玄枵虛也顓頊之虛虛也北陸虛也虛星在辰為玄枵居躔度為北陸在地為顓頊之虛營室謂之定定多佞反正也室星昏正見南方則興土功營宮室之時故曰營室之娵訾之口營室東璧也降婁奎婁也大梁昴也西陸昴也濁謂之畢畢星一名濁實沈所次故有沈濁之名焉咮謂之柳咮朱鳥之口柳鶉火也北極謂之北辰河鼓謂之牽牛明星謂之啓明啓音啓明星太白也晨見東方彗星為欃槍亦謂之孛乃妖變之星也欃初銜反奔星為彴約奔星流星也彴蒲渥反此篇大槩釋十二辰所次據壽星大辰析木星紀玄枵娵訾降婁大梁實沈鶉首鶉火鶉尾此當偹載不應遺却實沈鶉首鶉尾恐是簡編之失星名春祭曰祠夏祭曰礿秋祭曰嘗冬祭曰蒸祭天曰燔柴祭天之禮積柴以實牲醴玉帛而燔之使氣臭上逹於天祭地曰瘞埋祭地之禮既祭埋牲玉祭山曰庪縣庪居委反埋也或以牲幣埋於山或縣於林中祭川曰浮沉投祭水中或浮或沈祭星曰布以祭布露於地祭風曰磔披磔性體而祭之郭云今俗當大道中磔狗云以止風此其象也是類是禡師祭也師出征伐必類于上帝謂祭天也禡於所征之地謂兵祭也既伯既禱馬祭也伯馬祖也既伯既禱言禱于馬祖為擇吉日之辭故依本文重言既焉禘大祭也新列序昭穆之祭繹又祭也祭明之日尋繹復祭周曰繹商曰肜夏曰復胙宣八年壬午猶繹商書髙宗肜日復祚未見所出祭名春獵為搜夏獵為苗秋獵為獮冬獵為狩宵田為獠宵田夜獵也獠音遼管子曰獵獠畢弋火田為狩縱火而獵也乃立冢土戎醜攸行冢土大社戎醜大衆起大事動大衆必先有事乎社而後出謂之宜周官大祝云大師宜於社振旅闐闐振旅整衆也闐闐鼓聲出為治兵尚威武也幼賤在前貴勇力入為振旅反尊卑也尊老在前復常儀講武素錦綢杠纁帛縿素升龍于縿練旒九飾以組維以縷綢韜也音叨杠音江旗竿也纁絳色縿音衫衆旒所著者練絳練也組綦組也縷朱縷也先以白地錦韜旗竿則以絳帛為縿著於素錦又畫白龍於縿令上向則以絳練為九旒著於縿則以綦組飾旒之邊則以朱縷維持其旒令不曵地此並一旗之制也緇廣充幅長尋曰旐繼旐曰斾緇黑色帛也廣古曠反全幅長八尺屬於杠曰旐又以帛續旐末為燕尾者曰斾注旄首曰旌注繫也繫旄牛尾於竿首曰旌其下亦有旒郭云如今之幢有鈴曰旗縣鈴於竿首畫二龍相交錯革鳥曰旟錯雜以五采也革急也晝急疾之烏於縿蓋鷹隼之屬因章曰旃以白練為旒因其文章不復晝之周禮云通帛為旃旌旗釋地第九兩河間曰冀州河大河也東河之西西河之東是其境河南曰豫州自河南至江漢河西曰雍州雍於用反東距西河西距黑水漢南曰荆州自漢水南至衡山之陽江南曰揚州江大江也自江以南是其境濟河間曰兗州東南距濟西北距河濟東曰徐州濟束而南也燕曰幽州今燕薊是其地郭解云自易水至北狄齊曰營州今營丘也郭云自岱東至海此蓋殷制九州魯有大野舊云在魯西高平距野縣東北大澤按巨野今濟州治晉有大陸今懷州修武縣吳澤是秦有楊陓郭云在扶風汧縣西按汧今隴州汧源陓於于反宋有孟諸在南京虞城西北十里楚有雲夢江北為雲江南為夢雲今之玉沙監利景陵等縣是夢今之公安石首建寧等縣是吳越之間有具區今平江吳縣南太湖是禹貢曰震澤齊有海隅齊地束濵海此營州藪也燕有昭余祁郭云太原塢陵縣北九澤是鄭有圃田圃田一名原圃在開封中牟縣西北七里鄭州管城縣東三里其澤東西五十里南北二十六里西限長城東極官渡上承鄭州管城縣界曹家陂又益西北流為二十四小陂小鵠大鵠小斬大斬之類周有焦護郭云今扶風池陽縣瓠中是按此今在隴州汧陽縣北十藪大澤曰藪東陵阠南陵息慎西陵威夷中陵朱滕北陵西隃鴈門是也阠音信隃音戍西隃即鴈門也鴈門山在今代州餘未詳陵莫大於加陵未詳所在梁莫大於湨梁湨古壁反梁隄也湨水之隄也舊云湨水出河內軹縣東南至溫入河按軹唐省入濟源今隸河陽墳莫大於河墳墳大防八陵東方之美者有醫無閭之珣玗琪焉醫無閭山名地理志云在遼東無慮縣珣夷玉也玗石似玉者琪玉之可為琪瑱者東南之美者有會稽之竹箭焉會稽山在今越州出箭竹南方之美者有梁山之犀象焉梁山在今汝州梁縣西南之美者有華山之金石焉華山在今華隂西方之美者有霍山之多珠玉焉在晉州霍邑西北之美者有崑崙虛之璆琳琅玕焉山海經云崑崙之虛方八百里高萬仞按其山在中國之外西境璆琳美玉琅玕珠樹北方之美者有幽都之筋角焉幽都即幽州在今燕筋角牛筋角也東北之美者有斥山之文皮焉斥山未詳文皮馬豹皮中有岱嶽與其五榖魚鹽生焉岱嶽泰山也今中國惟有竹箭金石筋角文皮五榖魚鹽之利如犀象與珠則生南海玉出于闐中國並無往往昔日有之後人採竭矣九府東方有比目魚焉不比不行其名謂之鰈音牒與塌鯊相類一眼兩魚相合乃得行今所在海中皆有郭云江南呼王餘魚南方有比翼鳥焉不比不飛其名謂之鶼鶼山海經云崇吾山有鳥狀如鳧一翼一目相得乃飛鶼音兼西方有比肩獸焉與卭卭岠虗比為卭卭岠虗齧甘草即有難卭卭岠虗負而走其名謂之蟨郭云今鴈門黃武縣夏屋山中有獸形如而大相負共行俗呼為蟨鼠音厥北方有比肩民焉迭食而迭望此即半體人也亦猶魚鳥之相合迭望備警急也中有軹首蛇焉即歧頭蛇也所在或有之此四方中國之異氣也四方中國廣大生妖異無足怪者五方邑外謂之郊郊外謂之牧牧外謂之野野外謂之林林外謂之坰郭云邑國都也假令百里之國五十里之界界各十里此則以意揣之然理當如此下溼曰隰大野曰平廣平曰原高平曰陸大陸曰阜大阜曰陵大陵曰阿可食者曰原可食可種榖粟也陂者曰阪郭云阪陀不平下者曰溼田一嵗曰災郭云今江東呼初耕地反草為災二嵗曰新田三嵗曰畬野東至於泰遠西至於邠國南至於濮鉛北至於祝栗謂之四極皆四方極逺之國邠國非大王去邠之地觚竹北戶西王母日下謂之四荒觚竹在北北戶在南西王母在西日下在東皆四遠荒昧之國疑日下即今日本九夷八狄七戎六蠻謂之四海此四夷皆際海故謂之四海九夷在東風俗通云一曰玄菟二曰樂浪三曰高驪四曰滿飾五曰鳧更六曰索家七曰東屠八曰倭人九曰天鄙八狄在北風俗通云一曰天竺二曰咳首三曰僬嘵四曰跛踵五曰穿胸六曰耳七曰狗軹八曰旁春七戎在西風俗通云六戎一曰僥夷二曰戎英三曰老白四曰耆羌五曰鼻息六曰天剛六蠻在南風俗通云五蠻一曰月支二曰穢貊三曰胸奴四曰單于五曰白屋據風俗通雖如此謂然觀今諸國所在或異於此如天竺月支在西耳在南胸奴單于在北風俗通所記不必皆實聊備之耳岠齊州以南戴日為丹冗岠去也齊中也北戴斗極為空桐戴當也斗極極星也謂之天樞空桐北極山名東至日所出為太平西至日所入為太蒙淮南子曰入於蒙汜太平之人仁丹冗之人智太蒙之人信空桐之人武四極釋丘第十土之高也而非因人丘一成為敦丘冉成為陶丘再成鋭上為融丘三成為昆崙丘成猶層也敦頓也氓云至于頓丘陶丘今廣濟軍定陶城中有陶丘崑崙記丘崑崙山一名崑丘三重高一萬一千里如乘者乘丘兗州乘氏有乘丘城郭云如乘者形如車乘也又云或謂乘乃稻田塍埒亦存二説如渚者渚丘渚音渚郭云水中小洲為渚水潦所止泥丘方丘胡丘絶高為之京為當作謂因音訛文非人為之丘當曰非人為之謂之丘失謂之二文水潦所還埒丘埒畔也謂丘邊有界埒水繞環之上正章丘頂平澤中有丘都丘當途梧丘途出其右而還之畫丘途出其前戴丘途出其後昌丘前謂南後謂北水出其前渻丘水出其後沮丘水出其右正丘水出其左營丘渻所景反沮辭與反郭云今齊之營丘淄水過其南及東如覆敦者敦丘敦音堆祭祀受黍稷之器其形似簠簋覆敦者形如反敦也邐迤沙丘邐迤謂連接委曲也地理志巨鹿有紂所作沙丘臺在東北七十里左高咸丘右高臨丘前高旄丘旄丘在臨河縣東四十步後高陵丘偏高阿丘宛中宛丘丘背有丘為負丘左澤定丘右陵泰丘泰丘宋地如畞畞丘丘如田畞巷伯云猗于畞丘如陵陵丘陵大阜丘上有丘為宛丘此釋上宛中宛丘也陳有宛丘今為縣陳州治晉有潛丘郭云今在太原晉陽縣淮南有州黎丘郭云今在壽春縣天下有名丘五其三在河南其二在河北五丘未詳名號不知所在望崖灑而高岸夷上灑下不漘灑先典反深也謂其下水深也夷平也不者衍字隩隈崖內為隩外為隈下二句釋隩隈也畢堂牆終南山道名畢其邊若堂之牆今長安縣西有畢陌重崖岸兩崖相纍也岸上滸綿云率西水滸墳大防防隄涘為崖謂水邉窮瀆汜汜音似水無所通谷者溦謂汜通於谷則曰溦音眉丘崖岸釋山第十一河南華河西嶽河東岱河北恆江南衡華山在華隂嶽即吳嶽在隴州岱泰山在兗州恆常山在定州曲陽衡山本屬衡州近屬潭州此五山者以為中國之名山也山三襲陟襲重也重亦層也再成英一成伾大伾山在黎陽南七里山大而高嵩嵩中嶽在河南登封山小而高岑鋭而高嶠卑而大扈小而衆巋小山岌大山峘屬者嶧巋丘鬼反岌魚泣反峘音桓屬謂相連屬嶧山在兗州鄒縣斷續二十里獨者蜀蜀山川濟州上正章宛中隆山脊岡未及上翠微正平也宛高也未及上者謂未及頂上在旁陂陀之處也一説山氣青縹色曰翠微義與此異山頂冢崒者厜㕒頂巔也崒山巔之末此釋十月山冢崒崩之文厜㕒猶崔嵬也與詩崔嵬同音山如堂者密形似堂室尸子曰松柏之鼠不知堂密之有密摐如防者盛防隄也巒山嶞嶞山形狹長周頌云嶞山喬嶽重甗隒甗言遠反甑也山形如纍甑隒音儼左右有岸厒兩旁有水岸也厒口閣反大山宮小山霍小山别大山鮮宮繞也謂大山圍繞小山曰霍小山别於大山不相連屬者曰鮮山絶陘中斷也多小石磝多大石礐磝苦交反礐音角多草木岵無草木峐峐即屺也屺岵並釋陟岵文山上有水埒夏有水冬無水澩澩音學有水停水也山豄無所通溪豄即瀆也石戴土謂之崔嵬土戴石為砠此釋卷耳文山夾水澗陵夾水澞山有穴為岫山西曰夕陽山東曰朝陽澞音虞陽日也日出沒皆於山隱見焉泰山為東嶽華山為西嶽霍山為南嶽恆山為北嶽嵩髙為中嶽霍山即天柱山漢武帝以衡山遼曠移其神於此號為南嶽在今夀州霍山土人亦呼為南嶽也梁山晉望也晉國所望祭之山在同州夏陽西北釋水第十二泉一見一否為瀐井一有水一無水為瀱汋瀐音纎瀱音計汋什捉反一猶時也濫泉正出正出涌出也沃泉縣出縣出下出也采菽云觱沸檻泉即濫也縣出從上溜也氿泉穴出穴出仄出也大東云有冽氿泉湀闢流川過辨回川湀音揆回旋也灉反入河水決出復還入也灘沙出郭云今河中呼水中沙堆為灘音但按今錢塘亦有此語汧出不流歸異出同肥泉水云我思肥泉瀵大出尾下尾猶底也言其源深大出於底下者名瀵郭云今河東汾隂縣有水口如車輪許濆沸涌出其深無限名之為瀵馮翊邰陽縣復有瀵亦如之相去數里而夾河河中渚上又有一瀵瀵源皆濳相通出汾隂者人壅其流以為陂種稻呼其本所出處為瀵魁水醮曰厬醮盡也厬音軌水自河出為灉濟為濋汶為灛洛為波漢為濳淮為滸江為沱濄為洵潁為沙汝為濆皆大水别出為小水之名灉禹貢灉沮會同濳沱並見禹貢汝濆見周南餘未詳濄烏禾反水決之澤為汧水決入澤中也故前言汧出不流決復入為汜召南云江有汜河水清且瀾漪大波為瀾小波為淪直波為徑此並釋伐檀文江有沱河有灉汝有濆此則前義未審重言之意滸水崖水草交為湄江漢云江漢之滸巧言云居河之麋麋即湄濟有深涉深則厲淺則揭揭者揭衣也以衣涉水為厲潛行為泳泳沒行水底泛泛楊舟紼縭維之紼􅛢也縭緌也􅛢音律維舟大索縷繫也天子造舟諸侯維舟大夫方舟士特舟庶人乘泭此言橋渡有尊卑之制造七到反造舟比船也大明云造舟為梁維連四船方併兩船泭與桴同即木筏也據此亦書生牽於禮制之遇夫梁航本為渡水設也不過隨其闊狹淺深之施不可士特舟過廣渡則不敢往諸侯維舟遇尋尺之水則不復行寧有此理乎水注川曰溪注溪曰谷注谷曰溝注溝曰澮注澮曰瀆此言諸小水之所注入漸大則名異而非溪注谷谷注溝也逆流而上曰泝洄順流而下曰泝遊並釋蒹葭文正絶流曰亂禹貢亂于河江河淮濟為四瀆四瀆者發源注海者也中原之地諸水所流皆歸此四瀆惟此四瀆得專達海故為瀆祠焉水泉水中可居者曰洲小洲曰渚小渚曰沚小沚曰坻人所為為潏人力所為也水中河出崑崙虗色白崑崙西極之山山海經云河出崑崙西北隅虛山下基也所渠并千七百一川色黃謂河初出水色清色至并千七百渠而為一川則衆流所會沙壤溷淆遂為黃河百里一小曲千里一曲一直河自河陽以下經沙壤曲直無定流此謂河陽以上也河曲徒駭太史馬頰覆釜胡蘇簡潔鉤盤鬲津溝洫志漢成帝時河隄都尉許商上言古記九河之名有徒駭胡蘇鬲津今見在成平東光鬲縣界中自鬲津以北至徒駭其間相去二百里是九河所在徒駭最北鬲津最南徒駭在成平胡蘇在東光鬲津在鬲縣又知其餘六河以次推之曰太史曰馬頰曰覆釡在東光之北成平之南曰簡曰潔曰鉤盤在東光之南鬲縣之北今按圖志瀛州有成平故城又有徒駭河永靜軍有東光縣東連滄州有胡蘇亭因河命而滄州復有鬲津鉤盤太史河之名鬲縣故城在德州與滄比境庶可考焉九河自釋地已下至九河皆禹所命也言山川自有舊名禹治水後更命焉爾雅注卷中
